<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  html{background:#020617}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  .tap{min-width:48px;min-height:48px}
  @keyframes pulse-live{0%,100%{opacity:1}50%{opacity:.4}}
  .live-dot{animation:pulse-live 1.6s infinite}
  @keyframes slide-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .anim-in{animation:slide-in .3s ease-out}
  @keyframes flash-push{0%{background:#9f1239}100%{background:#1e293b}}
  .pushed-flash{animation:flash-push 1.2s ease-out}

  /* ── Part 8: category strip (Library/Community) — icon row + slanted tabs.
     Each element carries its palette via --c/--tx/--glow/--tint inline. The
     color "fill" is a clip-path wipe rising from the bottom; draining is the
     same transition in reverse. ── */
  .cat-icon{position:relative;display:inline-flex;min-width:0;min-height:0}
  .cat-icon svg{width:42px;height:42px;display:block}
  .cat-icon .basec{color:#475569;transition:color .4s}
  .cat-icon .fillc{position:absolute;inset:0;clip-path:inset(100% 0 0 0);
    transition:clip-path .65s cubic-bezier(.4,0,.2,1)}
  .cat-icon.on .fillc{clip-path:inset(0 0 0 0)}
  .cat-line{height:2px;flex:1;max-width:9rem;background:#e2e8f0;opacity:.55;border-radius:1px}
  html[data-theme=light] .cat-line{background:#64748b}
  .cat-tab{position:relative;transform:skew(-14deg);background:#0f172a;border:1px solid #334155;
    border-radius:.45rem;padding:.6rem 1.15rem .6rem 1.5rem;overflow:hidden;
    transition:background .5s ease,border-color .5s ease,box-shadow .5s ease;min-height:0;min-width:0}
  .cat-tab .stripe{position:absolute;top:-2px;bottom:-2px;width:4px;background:#475569;transition:background .5s ease}
  .cat-tab .s1{left:5px}.cat-tab .s2{left:12px}
  .cat-tab .lbl{display:inline-flex;align-items:center;gap:.4rem;transform:skew(14deg);font-weight:800;
    font-size:.78rem;letter-spacing:.06em;color:#94a3b8;transition:color .5s ease;white-space:nowrap}
  .cat-tab .qrs{width:32px;height:12px;color:#64748b;transition:color .5s ease}
  .cat-tab.on .qrs{color:#38bdf8}
  .cat-tab.on{background:var(--c);border-color:var(--c)}
  .cat-tab.on .lbl{color:var(--tx)}
  .cat-tab.on .stripe{background:var(--tx);opacity:.7}
  .cat-tab.active{box-shadow:0 0 16px var(--glow),0 0 4px var(--glow)}
  html[data-theme=light] .cat-tab{background:#eef1f6;border-color:#d3dae4}
  html[data-theme=light] .cat-tab.on{background:var(--c);border-color:var(--c)}
  .cat-mat{border:1px solid #1e293b;border-radius:1.1rem;padding:.9rem;
    transition:background .6s ease,border-color .6s ease,box-shadow .6s ease}
  html[data-theme=light] .cat-mat{border-color:#dde3ec}
  .cat-mat.colored{background:var(--tint);border-color:var(--c);
    box-shadow:0 0 24px var(--glow),inset 0 0 60px var(--tint)}
  .cat-card-edge{border-left:4px solid var(--c);
    background-image:linear-gradient(100deg,var(--tint),transparent 45%)}
  /* per-category palettes as classes (not inline styles) so themes can override */
  .cat-k-fire{--c:#ef4444;--tx:#fff;--glow:rgba(239,68,68,.55);--tint:rgba(239,68,68,.12);--hl:#ef4444}
  .cat-k-ems{--c:#e2e8f0;--tx:#0f172a;--glow:rgba(56,189,248,.6);--tint:rgba(56,189,248,.10);--hl:#38bdf8}
  .cat-k-mva{--c:#f59e0b;--tx:#231a02;--glow:rgba(245,158,11,.55);--tint:rgba(245,158,11,.12);--hl:#f59e0b}
  .cat-k-all{--c:#334155;--tx:#e2e8f0;--glow:rgba(148,163,184,.45)}
  /* B1 refresh: Home-Depot-style filter accordion. Each category is a collapsible
     header (expand ≠ select); picking All or a subcategory is what filters. Rows are
     compact option buttons that take the category's --hl on hover + selection. */
  .ft-cat + .ft-cat{margin-top:.3rem}
  .ft-cat-head,.ft-opt{display:flex;align-items:center;gap:.5rem;width:100%;
    padding:.4rem .55rem;border:1.5px solid transparent;border-radius:.55rem;
    font-size:.8rem;line-height:1.15;text-align:left;background:transparent;color:inherit;
    cursor:pointer;transition:border-color .15s ease,background-color .15s ease}
  .ft-cat-head{font-weight:700}
  .ft-opt{font-weight:500;font-size:.775rem}
  .ft-cat-head:hover,.ft-opt:hover{border-color:var(--hl)}
  .ft-cat-head.on,.ft-opt.on{border-color:var(--hl);background:var(--tint)}
  .ft-check{margin-left:auto;width:15px;height:15px;flex:none;color:var(--hl);opacity:0;transition:opacity .15s ease}
  .ft-cat-head.on .ft-check,.ft-opt.on .ft-check{opacity:1}
  .ft-cat-head .ft-chev{margin-left:.15rem}
  .ft-chev{width:15px;height:15px;flex:none;color:#94a3b8;transition:transform .2s ease}
  .ft-cat.open .ft-chev{transform:rotate(180deg)}
  .ft-subs{margin:.25rem 0 .1rem .45rem;padding-left:.5rem;border-left:2px solid #334155;
    display:flex;flex-direction:column;gap:.1rem;animation:ftIn .18s ease}
  html[data-theme=light] .ft-subs{border-color:#d3dae4}
  html[data-theme=light] .ft-chev{color:#71809a}
  @keyframes ftIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  /* Non-category accordions (Difficulty, Objective) reuse the same .ft- rows but
     have no category color, so they take the brand rose as their highlight. */
  .ft-plain{--hl:#f43f5e;--tint:rgba(244,63,94,.12)}

  /* Collapsible sidebar (desktop): the ☰ shrinks it to an icons-only rail. The
     id+class selectors outrank the Tailwind w-60/justify utilities without
     !important. Labels hide; hovering an icon reveals a light pill tooltip. */
  #sidebar.sb-collapsed{width:4.25rem}
  #sidebar.sb-collapsed .sb-link{justify-content:center;padding-left:.5rem;padding-right:.5rem}
  #sidebar.sb-collapsed .sb-link span{display:none}
  #sidebar.sb-collapsed .sb-section{display:none}
  #sidebar.sb-collapsed .sb-link{position:relative}
  #sidebar.sb-collapsed .sb-link::after{content:attr(data-tip);position:absolute;left:100%;top:50%;
    transform:translateY(-50%);margin-left:.55rem;z-index:60;pointer-events:none;opacity:0;
    background:#f1f5f9;color:#0f172a;padding:.25rem .6rem;border-radius:.45rem;font-size:.75rem;
    font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .12s ease}
  #sidebar.sb-collapsed .sb-link:hover::after{opacity:1}
  /* Reusable styled tooltip for the top-nav account + logout buttons. */
  .tip{position:relative}
  .tip::after{content:attr(data-tip);position:absolute;top:100%;right:0;margin-top:.45rem;z-index:60;
    pointer-events:none;opacity:0;background:#f1f5f9;color:#0f172a;padding:.25rem .6rem;border-radius:.45rem;
    font-size:.75rem;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:opacity .12s ease}
  .tip:hover::after{opacity:1}

  /* EMS "white" is invisible on the light theme — swap to a readable slate */
  html[data-theme=light] .cat-k-ems{--c:#94a3b8}

  /* ── v9 light theme: remaps the dark slate utilities under html[data-theme=light].
     The single colored text-white (toast) and colored buttons are untouched. ── */
  /* Soft, low-glare light theme: warm-cool neutral surfaces, no pure white,
     gentle borders + a faint card shadow for depth instead of hard contrast. */
  html[data-theme=light]{background:#e8ebf1}
  html[data-theme=light] body{background-color:#e8ebf1;color:#293241}
  html[data-theme=light] .bg-slate-950{background-color:#e8ebf1}
  html[data-theme=light] .bg-slate-900{background-color:#eef1f6}
  html[data-theme=light] .bg-slate-800{background-color:#f7f8fb;box-shadow:0 1px 2px rgba(15,23,42,.04)}
  html[data-theme=light] .bg-slate-700{background-color:#e0e5ee}
  html[data-theme=light] .bg-slate-600{background-color:#ccd3df}
  html[data-theme=light] .bg-slate-500{background-color:#9aa6b8}
  html[data-theme=light] .bg-slate-900\/95{background-color:rgba(238,241,246,.95)}
  html[data-theme=light] .bg-slate-950\/95{background-color:rgba(232,235,241,.95)}
  html[data-theme=light] .bg-slate-950\/80{background-color:rgba(232,235,241,.8)}
  html[data-theme=light] .bg-slate-800\/90{background-color:rgba(247,248,251,.9)}
  html[data-theme=light] .bg-slate-800\/60{background-color:rgba(247,248,251,.6)}
  html[data-theme=light] .bg-slate-600\/50{background-color:rgba(204,211,223,.5)}
  html[data-theme=light] .hover\:bg-slate-600:hover{background-color:#ccd3df}
  html[data-theme=light] .hover\:bg-slate-700:hover{background-color:#e0e5ee}
  html[data-theme=light] .hover\:bg-slate-800:hover{background-color:#eef1f6}
  html[data-theme=light] .hover\:bg-slate-950:hover{background-color:#dfe4ec}
  html[data-theme=light] .text-slate-100{color:#293241}
  html[data-theme=light] .text-slate-200{color:#334155}
  html[data-theme=light] .text-slate-300{color:#3d4a5d}
  html[data-theme=light] .text-slate-400{color:#5a6779}
  html[data-theme=light] .text-slate-500{color:#71809a}
  html[data-theme=light] .text-slate-600{color:#93a0b4}
  html[data-theme=light] .hover\:text-white:hover{color:#1f2937}
  html[data-theme=light] .border-slate-500{border-color:#aab4c4}
  html[data-theme=light] .border-slate-600{border-color:#d3dae4}
  html[data-theme=light] .border-slate-700{border-color:#dde3ec}
  html[data-theme=light] .border-slate-800{border-color:#e4e8f0}
  html[data-theme=light] ::-webkit-scrollbar-thumb{background:#ccd3df}
  /* soften the saturated brand colors a touch so they don't glare on light */
  html[data-theme=light] .text-sky-400{color:#0284c7}
  html[data-theme=light] .text-rose-400,html[data-theme=light] .text-rose-300{color:#e11d48}
  html[data-theme=light] .text-emerald-400{color:#059669}
  html[data-theme=light] .text-amber-400{color:#d97706}
  /* saturated buttons keep white text in light mode (they otherwise inherit
     the dark body color); amber-500 chips set their own dark text and win */
  html[data-theme=light] .bg-rose-600,html[data-theme=light] .bg-emerald-600,
  html[data-theme=light] .bg-sky-600,html[data-theme=light] .bg-amber-600,
  html[data-theme=light] .bg-rose-500,html[data-theme=light] .bg-emerald-500{color:#fff}
  html[data-theme=light] .bg-amber-500.text-slate-900{color:#0f172a}
</style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">

<nav class="sticky top-0 z-40 h-14 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-3 sm:px-4 flex items-center justify-between gap-2">
  <div class="flex items-center gap-1">
    <button id="nav-burger" class="tap flex items-center justify-center text-slate-300 hover:text-white" title="Menu"><i data-lucide="menu" class="w-5 h-5"></i></button>
    <a href="#/" class="flex items-center gap-2 px-1">
      <i data-lucide="flame" class="w-6 h-6 text-rose-600"></i>
      <span class="font-bold tracking-tight">ProtoCall<span class="text-rose-500">Trainer</span></span>
    </a>
  </div>
  <div id="nav-right" class="flex items-center gap-1"></div>
</nav>

<div class="flex min-h-[calc(100vh-3.5rem)]">
  <div id="sidebar-backdrop" class="fixed inset-0 top-14 z-20 bg-slate-950/80 hidden md:hidden"></div>
  <aside id="sidebar" class="fixed md:sticky top-14 z-30 h-[calc(100vh-3.5rem)] w-60 shrink-0 bg-slate-900 border-r border-slate-800 overflow-y-auto -translate-x-full md:translate-x-0 transition-transform duration-200"></aside>
  <div id="app" class="flex-1 min-w-0"></div>
</div>
<div id="toast" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-5 py-3 rounded-xl font-semibold shadow-xl hidden anim-in"></div>

<script>
const $ = sel => document.querySelector(sel);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, color) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = t.className.replace(/bg-\S+/, color || 'bg-emerald-600');
  t.classList.remove('hidden');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 2500);
}
// B5: bottom-left "Clone Successful" toast with an Undo affordance. Timing:
// 5s fully visible, then a 2s fade-out (~7s total). Hovering pauses the
// countdown and snaps a fading toast back to fully opaque; leaving restarts it.
// Undo runs onUndo (deletes the just-made clone) and dismisses immediately.
function cloneToast(onUndo) {
  document.getElementById('clone-toast')?.remove();
  const el = document.createElement('div');
  el.id = 'clone-toast';
  el.className = 'fixed bottom-4 left-4 z-50 flex items-center gap-3 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 shadow-2xl anim-in';
  el.style.transition = 'opacity 2s ease';
  el.innerHTML = `
    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-400 shrink-0"></i>
    <span class="text-sm font-semibold">Clone Successful</span>
    <button id="clone-undo" class="tap text-sm font-bold text-rose-400 hover:text-rose-300 underline underline-offset-2">Undo clone</button>`;
  document.body.appendChild(el);
  icons();
  let fadeT, killT;
  const start = () => {
    el.style.opacity = '1';
    fadeT = setTimeout(() => { el.style.opacity = '0'; }, 5000); // 5s visible
    killT = setTimeout(() => el.remove(), 7000);                 // +2s fade
  };
  const pause = () => { clearTimeout(fadeT); clearTimeout(killT); el.style.opacity = '1'; };
  el.onmouseenter = pause;
  el.onmouseleave = start;
  el.querySelector('#clone-undo').onclick = () => { pause(); el.remove(); onUndo(); };
  start();
}
// C1: reusable styled confirm dialog for destructive/persistent deletes (replaces
// native confirm()). Returns a promise — true on Remove, false on Cancel/backdrop/
// Esc. Cancel is focused by default so a stray Enter never confirms a delete.
function confirmDialog({ title = 'Are you sure you want to delete?', body = '', confirmLabel = 'Remove', cancelLabel = 'Cancel' } = {}) {
  return new Promise(resolve => {
    document.getElementById('confirm-modal')?.remove();
    const wrap = document.createElement('div');
    wrap.id = 'confirm-modal';
    wrap.className = 'fixed inset-0 z-[60] flex items-center justify-center p-4';
    wrap.innerHTML = `
      <div data-cm-bg class="absolute inset-0 bg-slate-950/70"></div>
      <div class="relative w-full max-w-sm bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-2xl anim-in">
        <div class="flex items-start gap-3">
          <span class="w-9 h-9 rounded-full bg-rose-500/15 text-rose-400 flex items-center justify-center shrink-0"><i data-lucide="alert-triangle" class="w-5 h-5"></i></span>
          <div class="min-w-0"><h2 class="text-base font-bold">${esc(title)}</h2>
            ${body ? `<p class="text-sm text-slate-400 mt-1">${esc(body)}</p>` : ''}</div>
        </div>
        <div class="flex justify-end gap-2 mt-5">
          <button data-cm-cancel class="tap text-sm font-semibold bg-slate-700 hover:bg-slate-600 rounded-xl px-4 py-2.5">${esc(cancelLabel)}</button>
          <button data-cm-ok class="tap text-sm font-bold bg-rose-600 hover:bg-rose-500 rounded-xl px-4 py-2.5">${esc(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);
    icons();
    const done = val => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(val); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    wrap.querySelector('[data-cm-ok]').onclick = () => done(true);
    wrap.querySelector('[data-cm-cancel]').onclick = () => done(false);
    wrap.querySelector('[data-cm-bg]').onclick = () => done(false);
    document.addEventListener('keydown', onKey);
    wrap.querySelector('[data-cm-cancel]').focus();
  });
}
// C1: generic bottom-left undo toast (accidental-delete recovery). Same timing as
// cloneToast — 5s visible, 2s fade, hover pauses/snaps back.
function undoToast(message, undoLabel, onUndo) {
  document.getElementById('undo-toast')?.remove();
  const el = document.createElement('div');
  el.id = 'undo-toast';
  el.className = 'fixed bottom-4 left-4 z-50 flex items-center gap-3 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 shadow-2xl anim-in';
  el.style.transition = 'opacity 2s ease';
  el.innerHTML = `
    <i data-lucide="trash-2" class="w-5 h-5 text-slate-400 shrink-0"></i>
    <span class="text-sm font-semibold">${esc(message)}</span>
    <button data-undo class="tap text-sm font-bold text-rose-400 hover:text-rose-300 underline underline-offset-2">${esc(undoLabel)}</button>`;
  document.body.appendChild(el);
  icons();
  let fadeT, killT;
  const start = () => { el.style.opacity = '1'; fadeT = setTimeout(() => { el.style.opacity = '0'; }, 5000); killT = setTimeout(() => el.remove(), 7000); };
  const pause = () => { clearTimeout(fadeT); clearTimeout(killT); el.style.opacity = '1'; };
  el.onmouseenter = pause;
  el.onmouseleave = start;
  el.querySelector('[data-undo]').onclick = () => { pause(); el.remove(); onUndo(); };
  start();
}
function showConflictBanner() {
  const b = $('#c-conflict-banner');
  if (b) b.classList.remove('hidden');
}
function icons(){ lucide.createIcons(); }
const token = localStorage.pcToken || (localStorage.pcToken = crypto.randomUUID());

let socket = null;
function getSocket() {
  if (!socket) socket = io();
  return socket;
}
function leaveSocket() {
  if (socket) { socket.removeAllListeners(); socket.disconnect(); socket = null; }
}

/* ═══ v9 shell: theme ═══ */
function applyTheme() {
  const pref = localStorage.pcTheme || 'system';
  const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',
  () => { if ((localStorage.pcTheme || 'system') === 'system') applyTheme(); });
applyTheme();

/* ═══ v9 shell: left sidebar ═══ */
const IMMERSIVE_ROUTES = new Set(['join', 'solo', 'host']); // full-focus flows: no sidebar
// Immersion is for *running* a session. Once it ends, the full-focus lock has to
// lift or the player is stranded: the sidebar is display:none on these routes, so
// the burger toggles nothing and every menu tap looks broken. Reported by a real
// user who was stuck after a hosted session ended. Cleared on every navigation.
let immersionLifted = false;
const liftImmersion = () => { immersionLifted = true; renderSidebar(); };
const routeName = () => location.hash.replace(/^#\//, '').split('?')[0].split('/')[0];
function openSidebar(open) {
  $('#sidebar').classList.toggle('-translate-x-full', !open);
  $('#sidebar-backdrop').classList.toggle('hidden', !open);
}
// Desktop-only collapse to an icons-only rail (persisted). On mobile the ☰ keeps
// its original job of sliding the full menu in/out.
let sidebarCollapsed = localStorage.pcSidebarCollapsed === '1';
const isDesktop = () => window.matchMedia('(min-width: 768px)').matches;
const applySidebarCollapse = () =>
  $('#sidebar').classList.toggle('sb-collapsed', sidebarCollapsed && isDesktop());
window.addEventListener('resize', applySidebarCollapse);
function renderSidebar() {
  const sb = $('#sidebar');
  const active = routeName();
  sb.style.display = IMMERSIVE_ROUTES.has(active) && !immersionLifted ? 'none' : '';
  const chiefOrAdmin = me && (me.role === 'site_admin' || (me.role === 'dept_admin' && me.department));
  const item = (hash, icon, label, extra = '') => {
    const on = active === hash.replace('#/', '') || (hash === '#/' && active === '');
    return `<a href="${hash}" data-tip="${label}" class="sb-link flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition
      ${on ? 'bg-slate-800 text-slate-100' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
      <i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span class="flex-1">${label}</span>${extra}</a>`;
  };
  sb.innerHTML = `
  <div class="p-3 space-y-1">
    <a href="#/create" data-tip="Create Scenario" class="sb-link tap flex items-center justify-center gap-2 w-full bg-rose-600 hover:bg-rose-500 rounded-xl py-2.5 font-bold text-sm mb-3"><i data-lucide="plus" class="w-4 h-4 shrink-0"></i><span class="sb-label">Create Scenario</span></a>
    ${item('#/', 'house', 'Home')}
    ${item('#/public', 'globe', 'Community')}
    ${me ? item('#/library', 'library', 'My Library') : ''}
    ${item('#/academies', 'graduation-cap', 'Academies')}
    ${item('#/coverage', 'grid-3x3', 'Coverage')}
    ${me ? item('#/department', 'building-2', me.department ? esc(me.department.name) : 'Department') : ''}
    ${chiefOrAdmin ? `<p class="sb-section px-4 pt-4 pb-1 text-[10px] font-black tracking-wider text-slate-500">ADMIN</p>` : ''}
    ${chiefOrAdmin ? item('#/review', 'clipboard-check', 'Review Queue', '<span id="sb-review-count" class="hidden text-[10px] font-black bg-sky-600 text-white rounded-full px-1.5 py-0.5"></span>') : ''}
    ${me?.role === 'site_admin' ? item('#/moderation', 'shield-alert', 'Moderation') : ''}
  </div>`;
  icons();
  applySidebarCollapse();
  sb.querySelectorAll('.sb-link').forEach(a => a.addEventListener('click', () => openSidebar(false)));
  if (chiefOrAdmin)

  'library': tab => tab === 'sessions' ? renderMe() : renderLibrary(),
  'create': id => renderCreator(id),
  'host': code => renderHost(code),
  'join': code => renderJoin(code),
  'login': () => renderAuth('login'),
  'signup': () => renderAuth('signup'),
  'verify': token => renderVerify(token),
  'reset': token => renderReset(token),
  // Back-compat: the old My Sessions URL redirects to the library tab.
  'me': () => { location.hash = '#/library/sessions'; },
  'public': tab => renderPublic(tab),
  'session': id => renderSessionDetail(id),
  'scenario': id => renderScenarioDetail(id),
  'solo': id => renderSolo(id),

  'academy': id => renderAcademy(id),
  'department': renderDepartment,
  'moderation': renderModeration,
  'review': renderReview,

};
function route() {
  leaveSocket();
  leaveCreator();
  immersionLifted = false;
  renderSidebar();
  const [name, arg] = location.hash.replace(/^#\//, '').split('?')[0].split('/');
  (routes[name] || renderLanding)(arg);
  // Always land at the top when visiting a page — otherwise the previous page's
  // scroll offset carries over (e.g. "+ New Scenario" opening halfway down).
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
// PR 5 — autosave dirty-tracking + unload warning. Delegated on `app` (which
// persists across renders) rather than on individual inputs, since the creator
// view's fields are re-wired on every drawQs()/drawMedia()/etc. `click` and
// `drop` are included because several edits (share toggles, add/delete question,
// media add/delete, the map-editor insert) are button clicks, not input/change.
['input', 'change', 'click', 'drop'].forEach(ev => app.addEventListener(ev, markDirty));
const warnUnsavedExit = e => { if (unsavedChanges) { e.preventDefault(); e.returnValue = ''; } };
window.addEventListener('beforeunload', warnUnsavedExit);
window.addEventListener('pagehide', warnUnsavedExit);

// Inline check + chevron glyphs for the filter accordion (currentColor so CSS can

const ftCheck = `<svg class="ft-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l4 4 8-9"/></svg>`;
const ftChev = `<svg class="ft-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;

const catTreeHtml = st => Object.entries(CAT_META).map(([name, m]) => {
  const sel = st.cats.has(name);

  return `

const selAccordionHtml = (cfg, st) => {

const filterDrawer = (fields, prefix) => `

// Open/close for the filter drawer. `left` is computed from the sidebar's live right
// edge so the drawer docks against it (and re-docks if the sidebar is collapsed while
// open). Esc + backdrop click close it; listeners are attached only while open.
const bindFilterDrawer = prefix => {
  const btn = $(`#${prefix}toggle`), drawer = $(`#${prefix}drawer`), backdrop = $(`#${prefix}backdrop`), closeBtn = $(`#${prefix}close`);
  if (!btn) return;
  const place = () => {
    const x = Math.max(0, $('#sidebar').getBoundingClientRect().right);
    drawer.style.left = backdrop.style.left = x + 'px';
  };
  const onKey = e => { if (e.key === 'Escape') show(false); };
  const show = on => {
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    if (on) place();
    ['opacity-0', '-translate-x-4', 'pointer-events-none'].forEach(c => drawer.classList.toggle(c, !on));
    ['opacity-0', 'pointer-events-none'].forEach(c => backdrop.classList.toggle(c, !on));
    if (on) { window.addEventListener('resize', place); document.addEventListener('keydown', onKey); }
    else { window.removeEventListener('resize', place); document.removeEventListener('keydown', onKey); }
  };
  btn.onclick = () => show(drawer.classList.contains('opacity-0'));
  closeBtn.onclick = () => show(false);
  backdrop.onclick = () => show(false);
};

// B1: multi-toggle category strip. `cats` is a Set of selected category names;
// empty = show everything (every tab reads "on"/colored, as before). Selecting a
// subset colors just those; the rest stay in their neutral look rather than graying
// out. The strip is categories-only (quick toggle) — nested subcategories live in
// the filter box (catTreeHtml). ALL (data-cattab="") clears the selection.
const catStrip = cats => {
  const on = name => cats.size === 0 || cats.has(name);
  const iconBtn = ([name, m]) => `
    <button data-cattab="${name}" class="cat-icon cat-k-${m.icon} ${on(name) ? 'on' : ''}" aria-label="${m.label}" title="${m.label}">
      <span class="basec">${catIcon(m.icon, '#94a3b8')}</span>
      <span class="fillc" style="color:var(--c)">${catIcon(m.icon, m.accent || '#fff')}</span>
    </button>`;
  // the EMS tab carries the blue ECG/QRS blip beside its label
  const qrs = `<svg class="qrs" viewBox="0 0 34 12" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
    <polyline points="1,7 9,7 12,10 16,1 20,11 23,4 26,7 33,7" stroke="currentColor"/></svg>`;
  const tabBtn = ([name, m]) => `
    <button data-cattab="${name}" class="cat-tab cat-k-${m.icon} ${on(name) ? 'on' : ''} ${cats.has(name) ? 'active' : ''}">
      <span class="stripe s1"></span><span class="stripe s2"></span><span class="lbl">${m.label}${m.accent ? qrs : ''}</span>
    </button>`;
  return `
  <div class="mb-4 space-y-3">
    <div class="flex items-center justify-center gap-3 sm:gap-4 px-2">
      ${Object.entries(CAT_META).map(iconBtn).join('<span class="cat-line"></span>')}
    </div>
    <div class="flex items-center justify-center gap-2.5 sm:gap-3 flex-wrap px-3">
      <button data-cattab="" class="cat-tab cat-k-all on ${cats.size === 0 ? 'active' : ''}">
        <span class="stripe s1"></span><span class="stripe s2"></span><span class="lbl">ALL</span>
      </button>
      ${Object.entries(CAT_META).map(tabBtn).join('')}
    </div>
  </div>`;
};

// Class-toggle update (no re-render) so the fill/drain transitions actually run.
// `active` (the neon glow) marks each explicitly-selected category; ALL glows only
// when nothing is selected. The mat behind the grid takes a single category's tint
// only when exactly one is selected (ambiguous with several, neutral with none).
const updateCatStrip = cats => {
  const showAll = cats.size === 0;
  app.querySelectorAll('[data-cattab]').forEach(el => {
    const name = el.dataset.cattab;
    if (name === '') { // ALL
      el.classList.toggle('active', showAll);
    } else {
      el.classList.toggle('on', showAll || cats.has(name));
      el.classList.toggle('active', cats.has(name));
    }
  });
  const mat = $('#cat-mat');
  if (!mat) return;
  const m = cats.size === 1 ? CAT_META[[...cats][0]] : null;
  mat.className = `cat-mat ${m ? `colored cat-k-${m.icon}` : ''}`;
};

const bindCatStrip = onPick =>
  app.querySelectorAll('[data-cattab]').forEach(el => el.onclick = () => onPick(el.dataset.cattab));
// Apply a top-strip / filter-box category toggle to the shared state Set. name===''
// (ALL) clears everything; re-toggling a category also drops its checked subs.
const toggleCat = (st, name) => {
  if (name === '') { st.cats.clear(); st.subs.clear(); return; }
  if (st.cats.has(name)) { st.cats.delete(name); (SUBCATS[name] || []).forEach(x => st.subs.delete(`${name}::${x}`)); }
  else st.cats.add(name);
};

// My Library is a personal area — your own scenarios and your own session
// history, behind login. Browsing everyone else's work lives on Community

const myLibraryShell = (active, inner) => `

async function renderLibrary() {
  if (!me) { sessionStorage.authNext = '#/library'; location.hash = '#/login'; return; }
  const [scenarios, objectives] = await Promise.all([
    fetch('/api/scenarios?scope=mine').then(r => r.json()),
    fetch('/api/objectives').then(r => r.json()).catch(() => []),
  ]);
  const wantDrafts = new URLSearchParams(location.hash.split('?')[1] || '').get('tab') === 'drafts';
  const st = { q: '', cats: new Set(), subs: new Set(), openCats: new Set(), openSel: new Set(), diff: '', obj: '', sort: 'updated', bucket: wantDrafts ? 'drafts' : 'published' };
  const selFilters = [
    { key: 'diff', label: 'Difficulty Level', opts: ['Rookie', 'Experienced', 'Veteran'] },
    { key: 'obj', label: 'Objective', opts: objectives },
  ];
  // B2: sort the visible set client-side (My Library is already client-filtered).
  // "Recently updated" is the default; timestamps are SQLite datetime strings, so
  // lexical compare == chronological. COALESCE(updated_at, created_at) covers a
  // brand-new row whose updated_at hasn't been backfilled yet.
  const sortScenarios = arr => {
    const upd = s => s.updated_at || s.created_at || '';
    const cre = s => s.created_at || '';
    const title = s => (s.title || '').toLowerCase();
    const a = arr.slice();
    if (st.sort === 'created_desc') a.sort((x, y) => cre(y).localeCompare(cre(x)));
    else if (st.sort === 'created_asc') a.sort((x, y) => cre(x).localeCompare(cre(y)));
    else if (st.sort === 'az') a.sort((x, y) => title(x).localeCompare(title(y)));
    else a.sort((x, y) => upd(y).localeCompare(upd(x))); // 'updated' (default)
    return a;
  };
  let view = browseView();
  // Everything here is already the caller's own (scope=mine), so there is no
  // ownership filter — just search + taxonomy. The bucket toggle splits drafts
  // (work in progress) from published; a pending published scenario stays
  // visible to its author (the card flags it IN REVIEW).
  const visible = () => scenarios.filter(s => {
    if (s.deleted_at) return false;
    if ((st.bucket === 'drafts') !== !!s.is_draft) return false;
    // B1 union: with categories selected, keep only those categories; within a
    // selected category, subcategory checks narrow it (no checks = all of it).
    if (st.cats.size) {
      if (!st.cats.has(s.category)) return false;
      const checked = (SUBCATS[s.category] || []).filter(x => st.subs.has(`${s.category}::${x}`));
      if (checked.length && !st.subs.has(`${s.category}::${s.subcategory}`)) return false;
    }
    if (st.diff && s.difficulty !== st.diff) return false;
    if (st.obj && s.objective_primary !== st.obj && s.objective_secondary !== st.obj) return false;
    if (st.q && !`${s.title} ${s.description}`.toLowerCase().includes(st.q.toLowerCase())) return false;
    return true;
  });
  const deleted = scenarios.filter(s => s.deleted_at);
  const draftCount = scenarios.filter(s => !s.deleted_at && s.is_draft).length;
  const pubCount = scenarios.filter(s => !s.deleted_at && !s.is_draft).length;
  const fields = `
    <input id="lf-q" placeholder="Search…" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:border-rose-500 focus:outline-none">
    <div><label class="text-xs font-semibold text-slate-400">Category</label>
      <div data-cattree class="mt-1.5"></div></div>
    <div data-selfilter="diff" class="mt-1"></div>
    <div data-selfilter="obj" class="mt-1"></div>
    ${resetBtn}`;
  app.innerHTML = myLibraryShell('scenarios', `
    <div class="flex items-center justify-between gap-3 mb-4">
      <div id="lib-bucket" class="flex gap-1.5"></div>
      <div class="flex items-center gap-2">
        <select id="lib-sort" aria-label="Sort by" class="tap bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-200 focus:border-rose-500 focus:outline-none">
          <option value="updated">Recently updated</option>
          <option value="created_desc">Newest</option>
          <option value="created_asc">Oldest</option>
          <option value="az">A–Z</option>
        </select>
        <div id="lib-view"></div>
      </div>
    </div>
    ${catStrip(st.cats)}
    <div class="min-w-0">
      ${filterSheet(fields.replaceAll('lf-', 'lfm-'), 'lfm-')}
      ${filterDrawer(fields, 'lf-')}
      <div id="cat-mat" class="cat-mat">
        <div id="lib-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </div>
      <div id="lib-deleted" class="mt-6"></div>
    </div>`);
  // Compact right-side actions for the list view (same data-* attrs → same
  // handlers as the grid buttons).
  const rowActions = s => st.bucket === 'drafts'
    ? `<a href="#/create/${s.id}" class="tap text-xs font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg px-3 py-1.5 flex items-center gap-1 whitespace-nowrap"><i data-lucide="pencil-line" class="w-3.5 h-3.5"></i>Continue</a>
       <button data-del="${s.id}" class="tap p-1.5 text-slate-400 hover:text-rose-400" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`
    : `<a href="#/create/${s.id}" class="tap p-1.5 text-slate-400 hover:text-white" title="Edit"><i data-lucide="pencil" class="w-4 h-4"></i></a>
       <button data-del="${s.id}" class="tap p-1.5 text-slate-400 hover:text-rose-400" title="Delete"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
       <button data-launch="${s.id}" class="tap text-xs font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg px-3 py-1.5 flex items-center gap-1 whitespace-nowrap"><i data-lucide="radio-tower" class="w-3.5 h-3.5"></i>Launch</button>`;
  const drawGrid = () => {
    const isDraft = st.bucket === 'drafts';
    const grid = $('#lib-grid');
    grid.className = view === 'list' ? 'space-y-2' : GRID_CLASS;
    grid.innerHTML = sortScenarios(visible()).map(s => view === 'list' ? scenarioRow(s, rowActions(s)) : scenarioCard(s, {
      corner: `<div class="flex items-center gap-0.5 -mt-1 -mr-1">
        <a href="#/create/${s.id}" class="p-1.5 text-slate-400 hover:text-white" title="Edit"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></a>
        <button data-del="${s.id}" class="p-1.5 text-slate-400 hover:text-rose-400" title="Delete"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></div>`,
      // Drafts are unplayable, so they get a Continue button, not Launch.
      footer: isDraft
        ? `<a href="#/create/${s.id}" class="tap flex-1 text-center text-sm font-bold bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 flex items-center justify-center gap-1.5"><i data-lucide="pencil-line" class="w-4 h-4"></i>Continue editing</a>`
        : `<a href="#/scenario/${s.id}" class="tap flex-1 text-center text-sm font-semibold bg-slate-700 hover:bg-slate-600 rounded-xl py-2.5">Details</a>
        <button data-launch="${s.id}" class="tap flex-1 text-sm font-bold bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 flex items-center justify-center gap-1.5"><i data-lucide="radio-tower" class="w-4 h-4"></i>Launch</button>`,
    })).join('') || (isDraft
      ? '<p class="text-slate-500 italic col-span-full">No drafts. Start one from <a href="#/create" class="text-rose-400 hover:underline">Create Scenario</a> and hit “Save as Draft”.</p>'
      : (pubCount || draftCount
        ? '<p class="text-slate-500 italic col-span-full">No scenarios match these filters.</p>'
        : '<p class="text-slate-500 italic col-span-full">Nothing here yet — <a href="#/create" class="text-rose-400 hover:underline">build a scenario</a> or <a href="#/public" class="text-rose-400 hover:underline">clone one from Community</a>.</p>'));
    $('#lib-deleted').innerHTML = deleted.length ? `
      <details><summary class="text-sm text-slate-500 cursor-pointer hover:text-slate-300">Deleted (${deleted.length})</summary>
      <div class="space-y-2 mt-2">${deleted.map(s => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center gap-3 opacity-80">
          <div class="flex-1 min-w-0"><p class="font-bold truncate text-slate-400">${esc(s.title)}</p>
            <p class="text-xs text-slate-500">deleted ${esc(s.deleted_at)}</p></div>
          <button data-restore="${s.id}" class="tap bg-slate-700 hover:bg-slate-600 rounded-xl px-4 py-2.5 font-bold text-sm">Restore</button>
        </div>`).join('')}</div></details>` : '';
    updateFilterCount('lf-', st); updateFilterCount('lfm-', st);
    icons();
    bindLaunchButtons();
    app.querySelectorAll('[data-del]').forEach(btn => btn.onclick = async () => {
      if (!(await confirmDialog({ title: 'Delete this scenario?', body: 'Past sessions are kept, and you can restore it later.' }))) return;
      const r = await fetch(`/api/scenarios/${btn.dataset.del}`, { method: 'DELETE' });
      if (r.ok) { toast('Scenario deleted'); renderLibrary(); } else toast('Delete failed', 'bg-rose-600');
    });
    app.querySelectorAll('[data-restore]').forEach(btn => btn.onclick = async () => {
      const r = await fetch(`/api/scenarios/${btn.dataset.restore}/restore`, { method: 'POST' });
      if (r.ok) { toast('Scenario restored'); renderLibrary(); } else toast('Restore failed', 'bg-rose-600');
    });
  };
  // desktop + mobile filter panels share state; bind both prefixes. Category +
  // subcategory now live in the synced checkbox tree (renderCatTree), so bind()
  // only wires the free-text/select fields.
  const bind = pre => {
    const g = id => $(`#${pre}${id}`);
    g('q').oninput = e => { st.q = e.target.value; drawGrid(); };
  };
  // Difficulty + Objective as single-select accordions (same look as the category
  // tree). Rendered into every [data-selfilter] container so drawer + sheet stay
  // synced; expanding is UI-only, picking a value (or "All") filters.
  const renderSelFilters = () => {
    app.querySelectorAll('[data-selfilter]').forEach(box => {
      const cfg = selFilters.find(f => f.key === box.dataset.selfilter);
      if (cfg) box.innerHTML = selAccordionHtml(cfg, st);
    });
    app.querySelectorAll('[data-selexpand]').forEach(b => b.onclick = () => {
      const k = b.dataset.selexpand;
      st.openSel.has(k) ? st.openSel.delete(k) : st.openSel.add(k);
      renderSelFilters();
    });
    app.querySelectorAll('[data-selkey]').forEach(b => b.onclick = () => {
      st[b.dataset.selkey] = b.dataset.selval;
      renderSelFilters(); drawGrid();
    });
  };
  // B1: render the category accordion into every [data-cattree] container (desktop
  // dropdown + mobile sheet) and (re)bind. Expanding (data-catexpand) is UI-only;
  // "All" (data-suball) / a subcategory (data-sub) is what actually filters.
  const renderCatTree = () => {
    app.querySelectorAll('[data-cattree]').forEach(box => box.innerHTML = catTreeHtml(st));
    app.querySelectorAll('[data-catexpand]').forEach(b => b.onclick = () => {
      const name = b.dataset.catexpand;
      st.openCats.has(name) ? st.openCats.delete(name) : st.openCats.add(name);
      renderCatTree();
    });
    app.querySelectorAll('[data-suball]').forEach(b => b.onclick = () => {
      const name = b.dataset.suball, subs = SUBCATS[name] || [];
      const allOn = st.cats.has(name) && !subs.some(x => st.subs.has(`${name}::${x}`));
      if (allOn) st.cats.delete(name);                                  // toggle whole category off
      else { st.cats.add(name); subs.forEach(x => st.subs.delete(`${name}::${x}`)); }
      updateCatStrip(st.cats); renderCatTree(); drawGrid();
    });
    app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
      const key = b.dataset.sub, name = key.slice(0, key.indexOf('::'));
      if (st.subs.has(key)) {
        st.subs.delete(key);
        if (!(SUBCATS[name] || []).some(x => st.subs.has(`${name}::${x}`))) st.cats.delete(name); // last sub → off
      } else { st.cats.add(name); st.subs.add(key); }
      updateCatStrip(st.cats); renderCatTree(); drawGrid();
    });
  };
  bindCatStrip(name => {
    toggleCat(st, name);
    updateCatStrip(st.cats); renderCatTree(); drawGrid();
  });
  // B3: clear every filter back to the show-everything default.
  const resetFilters = () => {
    st.cats.clear(); st.subs.clear(); st.openCats.clear(); st.openSel.clear(); st.q = ''; st.diff = ''; st.obj = ''; st.sort = 'updated';
    app.querySelectorAll('#lf-q, #lfm-q').forEach(i => i.value = '');
    $('#lib-sort').value = 'updated';
    updateCatStrip(st.cats); renderCatTree(); renderSelFilters(); drawGrid();
  };
  const bucketPill = (v, label, n) =>
    `<button data-bucket="${v}" class="tap px-3.5 py-1.5 rounded-full text-sm font-semibold ${st.bucket === v ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${label}${n ? ` <span class="opacity-70">${n}</span>` : ''}</button>`;
  const drawBucket = () => {
    $('#lib-bucket').innerHTML = bucketPill('published', 'Published', pubCount) + bucketPill('drafts', 'Drafts', draftCount);
    $('#lib-bucket').querySelectorAll('[data-bucket]').forEach(b =>
      b.onclick = () => { st.bucket = b.dataset.bucket; drawBucket(); drawGrid(); });
  };
  const drawView = () => {
    $('#lib-view').innerHTML = viewToggle(view);
    $('#lib-view').querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
      if (view === b.dataset.view) return;
      view = b.dataset.view; localStorage.pcBrowseView = view;
      drawView(); drawGrid();
    });
  };
  bind('lf-'); bind('lfm-');
  renderCatTree();
  renderSelFilters();
  bindFilterSheet('lfm-', st);
  bindFilterDrawer('lf-');
  app.querySelectorAll('[data-reset]').forEach(b => b.onclick = resetFilters);
  const sortSel = $('#lib-sort');
  sortSel.value = st.sort;
  sortSel.onchange = e => { st.sort = e.target.value; drawGrid(); };
  drawBucket();
  drawView();
  updateCatStrip(st.cats);
  drawGrid();
  icons();
}

const SUBCATS = {
  'Fireground': ['Residential','Commercial','Wildland','High-Rise'],
  'EMS': ['Cardiac','Trauma','Pediatric','Medical'],
  'Motor Vehicle Accidents': ['Extrication','Rollover','Hazardous Materials'],
};
let draftQs = [], draftShares = { dept: false, pub: false }, draftMedia = [], draftBldg = [], draftVeh = [], editingId = null, editingAsReviewer = false;

    history.pushState({ pcMapEditor: 1 }, '');       // re-trap: cancel the navigation, stay put
    showLeaveGuard();
  }
  window.addEventListener('popstate', onBack);
  function showLeaveGuard() {
    if (ov.querySelector('#map-leave-guard')) return;
    const g = document.createElement('div');
    g.id = 'map-leave-guard';
    g.className = 'absolute inset-0 z-10 flex items-center justify-center bg-slate-950/80 p-4';
    g.innerHTML = `
      <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4 anim-in">
        <div>
          <h3 class="font-bold text-lg flex items-center gap-2"><i data-lucide="triangle-alert" class="w-5 h-5 text-amber-400"></i>Leave the map editor?</h3>
          <p class="text-sm text-slate-400 mt-1">Your map hasn't been added to the scenario yet.</p>
        </div>
        <div class="flex flex-col gap-2">
          <button id="mlg-insert" class="tap w-full bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl py-2.5 font-bold">Insert map &amp; leave</button>
          <button id="mlg-discard" class="tap w-full bg-slate-800 hover:bg-slate-700 rounded-xl py-2.5 font-semibold text-rose-300">Leave without saving</button>
          <button id="mlg-stay" class="tap w-full text-slate-400 hover:text-white rounded-xl py-2">Keep editing</button>
        </div>
      </div>`;
    ov.appendChild(g);
    icons();
    g.querySelector('#mlg-stay').onclick = () => g.remove();
    g.querySelector('#mlg-discard').onclick = () => closeEditor();
    g.querySelector('#mlg-insert').onclick = () => { g.remove(); ov.querySelector('#map-insert').click(); };
  }

  const svg = ov.querySelector('#map-svg');
  const NS = 'http://www.w3.org/2000/svg';

  $bases();
  $palette();
  render();
  icons();

  function $bases() {
    const el = ov.querySelector('#map-bases');
    el.innerHTML = Object.entries(MAP_BASES).map(([k, b]) => `
      <button data-base="${k}" class="tap flex flex-col items-center gap-1 p-1.5 rounded-lg border ${k === baseKey ? 'border-amber-500 bg-slate-800' : 'border-slate-700 hover:border-slate-500'}">
        <svg viewBox="0 0 800 600" class="w-full h-8 rounded" style="pointer-events:none">${b.svg}</svg>
        <span class="text-[10px] text-slate-300 leading-tight text-center">${esc(b.label)}</span>
      </button>`).join('');
    el.querySelectorAll('[data-base]').forEach(btn => btn.onclick = () => {
      baseKey = btn.dataset.base;
      $bases();
      render();
    });
  }

  function $palette() {
    const el = ov.querySelector('#map-palette');
    el.innerHTML = Object.entries(MAP_STAMPS).map(([k, s]) => `
      <button data-stamp="${k}" class="tap shrink-0 flex flex-col items-center gap-1 px-3 py-2 rounded-lg border border-slate-700 hover:border-amber-500 bg-slate-800">
        <svg viewBox="${-s.w / 2 - 4} ${-s.h / 2 - 4} ${s.w + 8} ${s.h + 8}" class="w-12 h-8" style="pointer-events:none">${s.svg}</svg>
        <span class="text-[10px] text-slate-300 whitespace-nowrap">${esc(s.label)}</span>
      </button>`).join('');
    el.querySelectorAll('[data-stamp]').forEach(btn => btn.onclick = () => placeStamp(btn.dataset.stamp));
    ov.querySelector('#map-clear').onclick = () => {
      if (!placed.length) return;
      placed = []; selectedId = null;
      render();
      toast('Map cleared');
    };
  }

  function placeStamp(key) {
    const id = nextId++;
    placed.push({ id, stamp: key, x: 400, y: 300, rot: 0 });
    selectedId = id;
    render();
  }

  function clampXY(x, y) {
    return [Math.max(0, Math.min(800, x)), Math.max(0, Math.min(600, y))];
  }

  function svgPoint(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const x = (clientX - r.left) / r.width * 800;
    const y = (clientY - r.top) / r.height * 600;
    return clampXY(x, y);
  }

  function render() {
    const empty = ov.querySelector('#map-empty');
    empty.classList.toggle('hidden', placed.length > 0);
    empty.classList.toggle('flex', placed.length === 0);

    const sel = placed.find(p => p.id === selectedId);
    const toolbar = ov.querySelector('#map-toolbar');
    toolbar.classList.toggle('hidden', !sel);

    let inner = MAP_BASES[baseKey].svg;
    for (const p of placed) {
      const s = MAP_STAMPS[p.stamp];
      const isSel = p.id === selectedId;
      inner += `<g transform="translate(${p.x} ${p.y}) rotate(${p.rot})" data-placed="${p.id}" style="cursor:grab">
        ${isSel ? `<rect data-editor-only="1" x="${-s.w / 2 - 6}" y="${-s.h / 2 - 6}" width="${s.w + 12}" height="${s.h + 12}" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>` : ''}
        ${s.svg}
      </g>`;
    }
    svg.innerHTML = inner;

    svg.querySelectorAll('[data-placed]').forEach(g => {
      g.addEventListener('pointerdown', e => {
        const id = Number(g.dataset.placed);
        selectedId = id;
        const p = placed.find(pp => pp.id === id);
        const [px, py] = svgPoint(e.clientX, e.clientY);
        drag = { id, offX: px - p.x, offY: py - p.y };
        svg.setPointerCapture(e.pointerId);
        render();
      });
    });

    ov.querySelector('#map-toolbar').querySelectorAll('[data-act]').forEach(btn => btn.onclick = () => {
      const p = placed.find(pp => pp.id === selectedId);
      if (!p) return;
      if (btn.dataset.act === 'rotl') p.rot = (p.rot - 15) % 360;
      else if (btn.dataset.act === 'rotr') p.rot = (p.rot + 15) % 360;
      else if (btn.dataset.act === 'del') { placed = placed.filter(pp => pp.id !== selectedId); selectedId = null; }
      render();
    });
  }

  svg.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = placed.find(pp => pp.id === drag.id);
    if (!p) return;
    const [px, py] = svgPoint(e.clientX, e.clientY);
    [p.x, p.y] = clampXY(px - drag.offX, py - drag.offY);
    render();
  });
  const endDrag = () => { drag = null; };
  svg.addEventListener('pointerup', endDrag);
  svg.addEventListener('pointercancel', endDrag);

  ov.querySelector('#map-cancel').onclick = () => requestClose();
  ov.onclick = e => { if (e.target === ov) requestClose(); };

  ov.querySelector('#map-insert').onclick = async () => {
    if (uploading) return;
    if (!placed.length) { toast('Place at least one stamp first', 'bg-amber-500'); return; }
    uploading = true;
    const btn = ov.querySelector('#map-insert');
    const label = btn.textContent;
    btn.textContent = 'Uploading…';
    btn.disabled = true;
    const wasSelected = selectedId;
    selectedId = null;
    render();
    try {
      const out = svg.cloneNode(true);
      out.querySelectorAll('[data-editor-only]').forEach(n => n.remove());
      out.setAttribute('xmlns', NS);
      out.setAttribute('width', 1600);
      out.setAttribute('height', 1200);
      const blob = new Blob([new XMLSerializer().serializeToString(out)], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
      const c = document.createElement('canvas');
      c.width = 1600; c.height = 1200;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const png = await new Promise(r => c.toBlob(r, 'image/png'));
      const form = new FormData();
      form.append('file', png, 'map.png');
      const res = await fetch('/api/media', { method: 'POST', body: form });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Upload failed');
      const { url: mediaUrl } = await res.json();
      onInsert({ kind: 'map', url: mediaUrl });
      toast('Map added');
      closeEditor();
    } catch (err) {
      toast(err.message || 'Upload failed', 'bg-rose-600');
      selectedId = wasSelected;
      render();
    } finally {
      uploading = false;
      btn.textContent = label;
      btn.disabled = false;
    }
  };
}

async function renderCreator(id) {
  // Guests may build a *new* scenario (they sign up at save — see saveScenario).
  // Editing an existing one still requires an account (it's someone's saved row).
  if (!me && id) { sessionStorage.authNext = location.hash; location.hash = '#/login'; return; }
  leaveCreator(); // in case this is the reviewer-save re-render, not a fresh route()
  editingId = id || null;
  editingAsReviewer = false;
  editingRev = null;
  draftQs = [newQuestion()];
  draftMedia = [];
  myStagePresets = await fetch('/api/me/stage-presets').then(r => r.json()).catch(() => []);
  let existing = null;
  if (editingId) {
    const res = await fetch(`/api/scenarios/${editingId}`);
    existing = res.ok ? await res.json() : null;
    if (!existing || (!existing.mine && !existing.can_review)) { toast('Scenario not found', 'bg-rose-600'); location.hash = '#/library'; return; }
    editingAsReviewer = !existing.mine && existing.can_review;
    editingRev = existing.rev;
    draftQs = existing.questions.map(q => {
      const qq = { id: q.id, prompt: q.prompt, kind: q.kind, choices: q.choices, instructor_answer: q.instructor_answer, roles: rolesArr(q.roles ?? q.role_track), stage: q.stage ?? '', objective: q.objective ?? '', _correct: [] };
      if ((q.kind === 'multiple_choice' || q.kind === 'select_all') && Array.isArray(q.choices)) {
        const corrects = (q.instructor_answer || '').split('|').map(s => s.trim()).filter(Boolean);
        qq._correct = q.choices.map((c, ci) => (corrects.includes(c) ? ci : -1)).filter(ci => ci >= 0);
      }
      return qq;
    });
    draftMedia = existing.media.map(m => ({ kind: m.kind, url: m.url }));

  // Objectives are scoped to the scenario's category; load the initial set here

// edit) never fires while the user keeps interacting — a slow typist writing

  const restore = actionBtns.map(b => [b, b.disabled, b.innerHTML]);
  actionBtns.forEach(b => { b.disabled = true; b.innerHTML = 'Saving…'; });

    if (!editingAsReviewer && !body.objective_primary)

    if (body.objective_secondary && !body.objective_primary)
      return toast('Pick a primary objective first', 'bg-amber-500');

    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });

    const data = await res.json().catch(() => ({}));
    if (!editingId && data.id) editingId = data.id;
    if (data.rev !== undefined) editingRev = data.rev;
    autosaveBaseline = JSON.stringify(body);
    unsavedChanges = false;

function renderHost(code) {

  s.on('response_incoming', r => { if (hostState) { hostState.responses.push(r); drawMatrix(); } });
  s.on('answer_pushed', r => {
    if (!hostState) return;
    const found = hostState.responses.find(x => x.id === r.id);
    if (found) found.is_pushed = 1;
    drawMatrix();
  });
  // Phase 3: the server pushes a fresh roster on every join/answer/shift/boot.
  s.on('roster', roster => { if (hostState) { hostState.roster = roster; drawRoster(); } });
  s.on('participant_count', n => { const el = $('#crew-live'); if (el) el.textContent = Math.max(0, n - 1); });
  s.emit('join_room', { code, role: 'host' }, ({ error, state }) => {
    if (error) { toast(error, 'bg-rose-600'); location.hash = '#/library'; return; }
    drawHost(state);
  });
}

const answered = new Set(); // question_ids this participant submitted
const official = new Map(); // question_id -> model answer, filled only after full submission (PRD-v7)
function renderJoin(code) {
  const s = getSocket();
  ['answer_pushed','session_ended','stage_advanced','disconnect','booted'].forEach(ev => s.off(ev));
  s.on('stage_advanced', () => {
    toast('The instructor advanced the scenario', 'bg-amber-500');
    renderJoin(code); // rejoin picks up the newly visible stage
  });
  // Phase 3: the host removed this participant — their token is now dead.
  s.on('booted', () => {
    liftImmersion();
    sessionStorage.removeItem('pcRole:' + code);

      <i data-lucide="user-x" class="w-10 h-10 text-rose-400 mx-auto"></i>

    icons();

      const slot = document.getElementById('pushed-' + r.question_id);
      if (!slot || slot.querySelector(`[data-rid="${r.id}"]`)) return;
      const d = document.createElement('div');
      d.dataset.rid = r.id;
      d.className = 'pushed-flash bg-slate-800 border-l-4 border-rose-500 rounded-lg px-3 py-2.5 text-sm anim-in';
      d.innerHTML = `<p class="text-xs font-bold text-rose-400 mb-0.5 flex items-center gap-1"><i data-lucide="megaphone" class="w-3.5 h-3.5"></i>PUSHED BY INSTRUCTOR · ${esc(r.display_tag)}</p>${esc(r.body)}`;
      slot.appendChild(d); icons();
      toast('Instructor pushed an answer', 'bg-rose-600');
  });
  s.on('session_ended', () => {
    if (pState) pState.session.status = 'ended';
    renderJoin(code); // rejoin: session end unlocks all official answers (PRD-v7)
    liftImmersion();  // the drill is over — give the player the menu back
    const b = $('#conn-badge');
    if (b) { b.innerHTML = '<span class="w-2 h-2 bg-slate-500 rounded-full"></span> ENDED'; b.className = 'flex items-center gap-1.5 text-xs font-semibold bg-slate-800 text-slate-400 px-3 py-1.5 rounded-full'; }
    if (me) toast('Session saved to your Completed Library');
    else $('#guest-drawer')?.classList.remove('hidden');
  });

  s.off('connect');
  s.on('connect', () => { if (joinedOnce) renderJoin(code); }); // any reconnect → full rejoin + queue flush
  s.on('disconnect', () => {
    const b = $('#conn-badge');
    if (b && pState?.session.status === 'live') { b.innerHTML = 'RECONNECTING…'; b.className = 'text-xs font-semibold bg-amber-900/60 text-amber-300 px-3 py-1.5 rounded-full'; }
  });

  // string. Empty = no choice made yet → show the picker on a tracked scenario.

    if (error) { toast(error, 'bg-rose-600'); location.hash = '#/'; return; }

function qCard(q, i, responses) {
  const done = answered.has(q.id);

  const locked = done || inQueue;
  const mine = responses.find(r => r.participant_id === myId && r.question_id === q.id);
  const shownBody = mine?.body ?? (inQueue ? queuedAnswers.get(q.id) : '');
  const selSet = q.kind === 'select_all' ? new Set((shownBody || '').split('|').map(s => s.trim()).filter(Boolean)) : null;
  const input = (q.kind === 'multiple_choice' || q.kind === 'select_all')
    ? `<div class="space-y-2">${q.kind === 'select_all' ? '<p class="text-xs text-slate-400">Select all that apply.</p>' : ''}${(q.choices || []).map(c => {
        const on = q.kind === 'select_all' ? selSet.has(c) : shownBody === c;
        return `<label class="tap flex items-center gap-3 bg-slate-900 border ${on ? 'border-amber-500' : 'border-slate-700'} rounded-xl px-4 py-3 cursor-pointer has-[:checked]:border-amber-500">
          <input type="${q.kind === 'select_all' ? 'checkbox' : 'radio'}" name="${q.id}" value="${esc(c)}" ${locked ? 'disabled' : ''} ${on ? 'checked' : ''} class="accent-rose-600 w-5 h-5"><span class="text-sm">${esc(c)}</span></label>`;
      }).join('')}</div>`
    : `<textarea id="in-${q.id}" rows="3" ${locked ? 'disabled' : ''} placeholder="Type your answer…" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-amber-500 focus:outline-none disabled:opacity-60">${esc(shownBody)}</textarea>`;
  return `<div class="bg-slate-800 rounded-2xl p-4 space-y-3" id="card-${q.id}">
    <p class="font-semibold text-sm leading-snug"><span class="text-rose-400 font-bold">Q${i + 1}.</span> ${hasRoles(q.roles) ? `<span class="text-amber-400">${esc(roleLabel(q.roles))}</span> · ` : ''}${esc(q.prompt)}</p>
    <div id="pushed-${q.id}" class="space-y-2"></div>
    ${input}
    ${inQueue ? `<div class="flex items-center gap-2 bg-amber-950/40 border border-amber-800/50 rounded-xl px-4 py-3 text-sm text-amber-200"><i data-lucide="cloud-off" class="w-4 h-4 shrink-0"></i>Queued — sends automatically when you're back online</div>` : ''}

        <span class="flex items-center gap-2"><i data-lucide="${official.has(q.id) ? 'shield-check' : 'lock'}" class="w-4 h-4"></i>Official Answer${official.has(q.id) ? '' : (pState.session.stages?.length ? ' — unlocks when you finish this stage' : ' — unlocks after all questions')}</span>
        <i data-lucide="chevron-down" class="w-4 h-4"></i></button>
      <div id="acc-${q.id}" class="hidden px-4 pb-4 text-sm text-emerald-100 bg-emerald-950/40 pt-3 border-t border-emerald-900">${esc(official.get(q.id) ?? '')}</div>
    </div>
    ${done ? `<div><label class="text-xs font-semibold text-amber-400 flex items-center gap-1"><i data-lucide="pencil-line" class="w-3.5 h-3.5"></i>Your Notes</label>
      <textarea data-note="${q.id}" rows="2" placeholder="Tactical notes — saved automatically" class="mt-1 w-full bg-amber-950/30 border border-amber-800/50 rounded-xl px-4 py-3 text-sm focus:border-amber-500 focus:outline-none"></textarea></div>` : ''}
  </div>`;
}
/* ─── Offline answer queue: queued in localStorage, flushed on rejoin ─── */
const queuedAnswers = new Map(); // question_id -> body (current room)
const readQueue = () => { try { return JSON.parse(localStorage.pcQueue || '{}'); } catch { return {}; } };
function queuePut(code, qid, body) {
  const q = readQueue();
  (q[code] ??= []).push({ question_id: qid, body });
  localStorage.pcQueue = JSON.stringify(q);
  queuedAnswers.set(qid, body);
}
function queueRemove(code, qid) {
  const q = readQueue();
  q[code] = (q[code] || []).filter(x => x.question_id !== qid);
  if (!q[code].length) delete q[code];
  localStorage.pcQueue = JSON.stringify(q);
  queuedAnswers.delete(qid);
}

function applySubmitSuccess(qid, body, res) {
  answered.add(qid);
  pState.responses.push({ id: 'local-' + qid, question_id: qid, participant_id: myId, body, is_pushed: 0 });
  if (res?.official_answers)
    Object.entries(res.official_answers).forEach(([id, a]) => official.set(id, a));
  drawParticipant();
  return !!res?.complete;
}

function sendResponse(qid, val) {
  const code = pState.session.room_code;
  getSocket().timeout(5000).emit('submit_response', { question_id: qid, body: val }, (err, res) => {
    if (err) { // socket down or server unreachable — hold it locally
      queuePut(code, qid, val);
      drawParticipant();
      toast('Offline — answer queued, sends when you reconnect', 'bg-amber-500');
      return;
    }
    if (res?.error) return toast('Submit failed', 'bg-rose-600');
    const complete = applySubmitSuccess(qid, val, res);
    toast(complete ? 'All answered — Official Answers unlocked'
      : res?.official_answers ? 'Stage complete — its Official Answers unlocked' : 'Submitted');
  });
}

function flushQueue() {
  const code = pState.session.room_code;
  const items = readQueue()[code] || [];
  queuedAnswers.clear();
  items.forEach(it => queuedAnswers.set(it.question_id, it.body));
  items.forEach(it => {
    // skip anything the server already has (e.g. flushed from another tab)
    if (pState.responses.some(r => r.participant_id === myId && r.question_id === it.question_id)) {
      queueRemove(code, it.question_id);
      return;
    }
    getSocket().timeout(5000).emit('submit_response', { question_id: it.question_id, body: it.body }, (err, res) => {
      if (err || res?.error) return; // still offline — stays queued for next rejoin
      queueRemove(code, it.question_id);
      applySubmitSuccess(it.question_id, it.body, res);
      toast('Queued answer delivered');
    });
  });
}

function bindCards() {
  app.querySelectorAll('[data-submit]').forEach(btn => btn.onclick = () => {
    const qid = btn.dataset.submit;
    const q = pState.questions.find(x => x.id === qid);
    let val;
    if (q.kind === 'multiple_choice') {
      val = app.querySelector(`input[name="${qid}"]:checked`)?.value;
      if (!val) return toast('Pick an option first', 'bg-amber-500');
    } else if (q.kind === 'select_all') {
      const checked = [...app.querySelectorAll(`input[name="${qid}"]:checked`)].map(x => x.value);
      if (!checked.length) return toast('Pick at least one option', 'bg-amber-500');
      val = checked.join(' | ');
    } else {
      val = $('#in-' + qid).value.trim();
      if (!val) return toast('Type an answer first', 'bg-amber-500');
    }
    sendResponse(qid, val);
  });
  app.querySelectorAll('[data-acc]').forEach(btn => btn.onclick = () => {
    const qid = btn.dataset.acc;
    if (!official.has(qid)) return toast(pState.session.stages?.length ? 'Locked until you finish this stage' : 'Locked until you answer every question', 'bg-amber-500');
    document.getElementById('acc-' + qid).classList.toggle('hidden');
  });
  app.querySelectorAll('[data-note]').forEach(ta => {
    ta.onchange = () => getSocket().emit('save_note', { question_id: ta.dataset.note, body: ta.value }, () => toast('Note saved', 'bg-amber-500'));
  });
}

        <a href="#/login" class="tap inline-block mt-1 bg-slate-700 hover:bg-slate-600 rounded-xl px-5 py-2.5 font-semibold">Back to log in</a></div>`;
      icons();
    };
    $('#r-go').onclick = go;
    $('#r-email').addEventListener('keydown', e => e.key === 'Enter' && go());
    icons();
    return;
  }
  app.innerHTML = `<main class="max-w-sm mx-auto p-6 pt-12 anim-in"><div class="bg-slate-800 rounded-2xl p-6 space-y-4">
    <h1 class="text-xl font-bold">Choose a new password</h1>

    <p id="r-err" class="text-sm text-rose-400 hidden"></p>
    <button id="r-go" class="tap w-full bg-rose-600 hover:bg-rose-500 rounded-xl py-3 font-bold">Set password &amp; log in</button>
  </div></main>`;
  const go = async () => {
    const res = await fetch('/api/auth/reset', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: tokenArg, password: $('#r-pass').value }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) { $('#r-err').textContent = body.error; $('#r-err').classList.remove('hidden'); return; }
    me = await fetch('/api/me').then(r => r.json());
    renderNav();
    toast(`Password updated — welcome back, ${body.display_name}`);
    location.hash = '#/library/sessions';
  };
  $('#r-go').onclick = go;
  $('#r-pass').addEventListener('keydown', e => e.key === 'Enter' && go());
  icons();
}

async function renderMe() {
  if (!me) { sessionStorage.authNext = '#/library/sessions'; location.hash = '#/login'; return; }
  const sessions = await fetch('/api/me/sessions').then(r => r.json());
  app.innerHTML = myLibraryShell('sessions', `
    <div class="max-w-2xl space-y-4">
    ${me.email_verified === false ? `
    <div class="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-4 flex items-start gap-3">
      <i data-lucide="mail-warning" class="w-5 h-5 text-amber-400 shrink-0 mt-0.5"></i>
      <div class="flex-1 text-sm">
        <p class="font-semibold text-amber-200">Verify your email</p>
        <p class="text-slate-400">Confirm <span class="text-slate-200">${esc(me.email)}</span> so you can recover your account. Check your inbox for the link.</p>
      </div>
      <button id="me-resend" class="tap text-sm bg-amber-500/20 hover:bg-amber-500/30 text-amber-200 rounded-xl px-3 py-2 font-semibold shrink-0">Resend</button>
    </div>` : ''}
    ${sessions.map(s => {
      // Phase 2 session cards: mode (SOLO/HOSTED/JOINED) and status (IN PROGRESS/
      // COMPLETED — never "live", which collides with the live *mode*) are their
      // own badges, stacked in a fixed right-side column. A thin questions-
      // answered bar shows only on in-progress solo runs.
      const mode = s.mode === 'solo' ? ['SOLO', 'bg-rose-900/60 text-rose-300']
        : s.hosted ? ['HOSTED', 'bg-sky-900/60 text-sky-300']
        : ['JOINED', 'bg-slate-700 text-slate-300'];
      const live = s.status === 'live';
      const badge = 'text-[10px] font-bold tracking-wider px-2.5 py-1 rounded-full whitespace-nowrap';
      const soloBar = s.mode === 'solo' && live && s.q_total ? `
          <div class="mt-2 max-w-[13rem]">
            <div class="text-[10px] text-slate-500 mb-1">${s.q_answered}/${s.q_total} answered</div>
            <div class="h-1 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-rose-500 rounded-full" style="width:${Math.round(s.q_answered / s.q_total * 100)}%"></div></div>
          </div>` : '';
      return `
    <a href="#/session/${s.id}" class="block bg-slate-800 hover:bg-slate-700 rounded-2xl p-4">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0 flex-1">
          <p class="font-bold truncate">${esc(s.title)}</p>
          <p class="text-sm text-slate-400 truncate">${esc(s.started_at)}${s.mode === 'solo' ? '' : ` · room ${esc(s.room_code)}`}</p>
          ${soloBar}
        </div>
        <div class="flex flex-col items-end gap-1.5 shrink-0">
          <span class="${badge} ${mode[1]}">${mode[0]}</span>
          <span class="${badge} ${live ? 'bg-emerald-900/60 text-emerald-300' : 'bg-slate-700 text-slate-400'}">${live ? 'IN PROGRESS' : 'COMPLETED'}</span>
          ${(s.hosted || s.mode === 'solo') && !live ? `<button data-delsession="${s.id}" title="Delete session" class="tap p-1 -mr-1 text-slate-500 hover:text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
        </div>
      </div>
    </a>`;
    }).join('') || '<p class="text-sm text-slate-500 italic">No sessions yet — host one from a scenario or try one solo.</p>'}
    </div>`);
  icons();
  const resend = $('#me-resend');
  if (resend) resend.onclick = async () => {
    resend.disabled = true;
    await fetch('/api/auth/verify/request', { method: 'POST' });
    toast('Verification email sent — check your inbox');
  };
  app.querySelectorAll('[data-delsession]').forEach(btn => btn.onclick = async e => {
    e.preventDefault(); e.stopPropagation(); // the row itself is a link
    if (!(await confirmDialog({ title: 'Delete this session?', body: 'Its answers are removed from your library. This can\'t be undone.' }))) return;
    const r = await fetch(`/api/me/sessions/${btn.dataset.delsession}`, { method: 'DELETE' });
    if (r.ok) { toast('Session deleted'); renderMe(); }
    else toast((await r.json()).error ?? 'Delete failed', 'bg-rose-600');
  });
}
