async function renderPublic(scopeArg) {
  const hq = new URLSearchParams(location.hash.split('?')[1] || '');
  // Two scopes: the public catalogue, and (for department members) the set
  // shared with their department — where department-shared-by-others scenarios
  // live now that My Library is owner-only.
  const scope = (scopeArg === 'department' && me?.department) ? 'department' : 'community';
  const [list, objectives] = await Promise.all([
    fetch('/api/public/scenarios' + (scope === 'department' ? '?scope=department' : '')).then(r => r.json()),
    fetch('/api/objectives').then(r => r.json()).catch(() => []),
  ]);
  const st = { q: '', cats: new Set(), subs: new Set(), openCats: new Set(), openSel: new Set(), diff: '', obj: '', veh: new Set() };
  const selFilters = [
    { key: 'diff', label: 'Difficulty', opts: ['Introductory', 'Standard', 'Advanced'] },
    { key: 'obj', label: 'Objective', opts: objectives },
  ];
  // Deep links (?category=…&subcategory=…) arrive pre-selected (and expanded).
  const dlCat = hq.get('category'), dlSub = hq.get('subcategory');
  if (dlCat) { st.cats.add(dlCat); st.openCats.add(dlCat); if (dlSub) st.subs.add(`${dlCat}::${dlSub}`); }
  let view = browseView();
  const visible = () => list.filter(s => {
    // B1 union: selected categories keep only those; checked subcategories narrow
    // within their category (no checks = the whole category).
    if (st.cats.size) {
      if (!st.cats.has(s.category)) return false;
      const checked = (SUBCATS[s.category] || []).filter(x => st.subs.has(`${s.category}::${x}`));
      if (checked.length && !st.subs.has(`${s.category}::${s.subcategory}`)) return false;
    }
    if (st.diff && s.difficulty !== st.diff) return false;
    if (st.obj && s.objective_primary !== st.obj && s.objective_secondary !== st.obj) return false;
    // Phase 4: vehicle type is match-any — a scenario passes if it carries any of
    // the selected types. Only meaningful under the MVA category.
    if (st.veh.size && !parseBldg(s.vehicle_type).some(v => st.veh.has(v))) return false;
    if (st.q && !`${s.title} ${s.description} ${s.author_name}`.toLowerCase().includes(st.q.toLowerCase())) return false;
    return true;
  });
  const fields = `
    <input id="pf-q" placeholder="Search…" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:border-rose-500 focus:outline-none">
    <div><label class="text-xs font-semibold text-slate-400">Category</label>
      <div data-cattree class="mt-1.5"></div></div>
    <div data-selfilter="diff" class="mt-1"></div>
    <div data-selfilter="obj" class="mt-1"></div>
    <div id="pf-veh-block" class="hidden"><label class="text-xs font-semibold text-slate-400">Vehicle type <span class="text-slate-500">(match any)</span></label>
      <div id="pf-veh" class="flex flex-wrap gap-1.5 mt-1.5">
        ${VEHICLE_TYPES.map(v => `<button type="button" data-veh="${esc(v)}" class="tap text-xs px-2.5 py-1 rounded-full border bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500">${esc(v)}</button>`).join('')}
      </div></div>
    ${resetBtn}`;
  app.innerHTML = `
  <main class="max-w-6xl mx-auto p-4 sm:p-6 anim-in">
    <div class="flex items-center justify-between mb-4">
      <div><h1 class="text-2xl font-bold">Community</h1>
        <p class="text-sm text-slate-400">${scope === 'department'
          ? `Scenarios shared with ${esc(me.department.name)}.`
          : 'Public scenarios shared by the whole community.'}</p></div>
      <div class="hidden sm:flex items-center">
        <a href="#/academies" class="tap flex items-center gap-1.5 text-sm text-slate-300 hover:text-white px-3 py-2"><i data-lucide="graduation-cap" class="w-4 h-4"></i>Academies</a>
        <a href="#/coverage" class="tap flex items-center gap-1.5 text-sm text-slate-300 hover:text-white px-3 py-2"><i data-lucide="grid-3x3" class="w-4 h-4"></i>Coverage</a>
      </div>
    </div>
    <div class="flex items-center justify-between gap-3 mb-4">
      <div class="flex gap-1">${me?.department ? `
        <a href="#/public" class="tap px-3.5 py-1.5 rounded-full text-sm font-semibold ${scope === 'community' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Community</a>
        <a href="#/public/department" class="tap px-3.5 py-1.5 rounded-full text-sm font-semibold ${scope === 'department' ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${esc(me.department.name)}</a>` : ''}</div>
      <div id="pub-view"></div>
    </div>
    ${catStrip(st.cats)}
    <div class="min-w-0">
      ${filterSheet(fields.replaceAll('pf-', 'pfm-'), 'pfm-')}
      ${filterDrawer(fields, 'pf-')}
      <div id="cat-mat" class="cat-mat">
        <div id="pub-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </main>`;
  // Compact list-view actions reuse the same data-* attrs as the grid buttons.
  const rowActions = s => `
    ${scope === 'department' ? '' : `<button data-vote="${s.id}" class="tap flex items-center gap-1 text-xs font-semibold px-2 py-1.5 rounded-lg ${s.my_vote ? 'bg-amber-600 text-white' : 'bg-slate-700 hover:bg-slate-600'}"><i data-lucide="arrow-big-up" class="w-3.5 h-3.5"></i><span data-votecount="${s.id}">${s.votes}</span></button>`}
    <button data-clone="${s.id}" class="tap p-1.5 text-slate-400 hover:text-white" title="Clone to my library"><i data-lucide="copy-plus" class="w-4 h-4"></i></button>
    <a href="#/scenario/${s.id}" class="tap text-xs font-bold bg-rose-600 hover:bg-rose-500 rounded-lg px-3 py-1.5 whitespace-nowrap">Try Solo</a>
    <button data-launch="${s.id}" class="tap text-xs font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg px-3 py-1.5 flex items-center gap-1 whitespace-nowrap"><i data-lucide="radio-tower" class="w-3.5 h-3.5"></i>Launch</button>`;
  const drawGrid = () => {
    const grid = $('#pub-grid');
    grid.className = view === 'list' ? 'space-y-2' : GRID_CLASS;
    grid.innerHTML = visible().map(s => view === 'list' ? scenarioRow(s, rowActions(s)) : scenarioCard(s, {
      // Votes and reports are community-catalogue actions; the department scope
      // just lists what's shared with your crew, with clone / solo / launch.
      corner: scope === 'department' ? '' : `<button data-vote="${s.id}" class="flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-full ${s.my_vote ? 'bg-amber-600 text-white' : 'bg-slate-700 hover:bg-slate-600'}">
        <i data-lucide="arrow-big-up" class="w-3.5 h-3.5"></i><span data-votecount="${s.id}">${s.votes}</span></button>`,
      footer: `<button data-clone="${s.id}" class="tap p-2.5 text-slate-400 hover:text-white" title="Clone to my library"><i data-lucide="copy-plus" class="w-4 h-4"></i></button>
        ${scope === 'department' ? '' : `<button data-report="${s.id}" class="tap p-2.5 text-slate-400 hover:text-rose-400" title="Report"><i data-lucide="flag" class="w-4 h-4"></i></button>`}
        <a href="#/scenario/${s.id}" class="tap flex-1 text-center text-sm font-bold bg-rose-600 hover:bg-rose-500 rounded-xl py-2.5">Try Solo</a>
        <button data-launch="${s.id}" class="tap flex-1 text-sm font-bold bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 flex items-center justify-center gap-1.5"><i data-lucide="radio-tower" class="w-4 h-4"></i>Launch</button>`,
    })).join('') || (scope === 'department'
      ? '<p class="text-sm text-slate-500 italic col-span-full">Nothing shared with your department yet.</p>'
      : '<p class="text-sm text-slate-500 italic col-span-full">No public scenarios match.</p>');
    updateFilterCount('pf-', st); updateFilterCount('pfm-', st);
    icons();
    bindPublicActions();
    bindLaunchButtons();
  };
  const drawView = () => {
    $('#pub-view').innerHTML = viewToggle(view);
    $('#pub-view').querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
      if (view === b.dataset.view) return;
      view = b.dataset.view; localStorage.pcBrowseView = view;
      drawView(); drawGrid();
    });
  };
  // Phase 4: the vehicle-type filter only applies to MVA. Show its block when that
  // category is selected, restyle the chips to st.veh across both the desktop panel
  // and the mobile sheet, and drop selections when the category is deselected.
  const syncVeh = () => {
    const on = st.cats.has('Motor Vehicle Accidents');
    if (!on) st.veh.clear();
    ['pf-', 'pfm-'].forEach(pre => {
      const block = $(`#${pre}veh-block`); if (block) block.classList.toggle('hidden', !on);
      const box = $(`#${pre}veh`); if (!box) return;
      box.querySelectorAll('[data-veh]').forEach(btn => {
        btn.className = 'tap text-xs px-2.5 py-1 rounded-full border ' + (st.veh.has(btn.dataset.veh)
          ? 'bg-amber-600 border-amber-500 font-semibold text-white'
          : 'bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500');
      });
    });
  };
  const bind = pre => {
    const g = id => $(`#${pre}${id}`);
    g('q').oninput = e => { st.q = e.target.value; drawGrid(); };
    g('veh').querySelectorAll('[data-veh]').forEach(btn => btn.onclick = () => {
      const v = btn.dataset.veh;
      if (st.veh.has(v)) st.veh.delete(v); else st.veh.add(v);
      syncVeh(); drawGrid();
    });
  };
  // Difficulty + Objective single-select accordions (same look as the category
  // tree), rendered into every [data-selfilter] container so drawer + sheet sync.
  const renderSelFilters = () => {
    app.querySelectorAll('[data-selfilter]').forEach(box => {
      const cfg = selFilters.find(f => f.key === box.dataset.selfilter);
      if (cfg) box.innerHTML = selAccordionHtml(cfg, st);
    });
    app.querySelectorAll('[data-selexpand]').forEach(b => b.onclick = () => {
      const k = b.dataset.selexpand;
      st.openSel.has(k) ? st.openSel.delete(k) : st.openSel.add(k);
      renderSelFilters();
    });
    app.querySelectorAll('[data-selkey]').forEach(b => b.onclick = () => {
      st[b.dataset.selkey] = b.dataset.selval;
      renderSelFilters(); drawGrid();
    });
  };
  // B1: category accordion (desktop dropdown + mobile sheet). Expanding
  // (data-catexpand) is UI-only; "All" (data-suball) / a subcategory (data-sub) is
  // what filters. syncVeh keeps the MVA vehicle-type block in step with the cats.
  const renderCatTree = () => {
    app.querySelectorAll('[data-cattree]').forEach(box => box.innerHTML = catTreeHtml(st));
    app.querySelectorAll('[data-catexpand]').forEach(b => b.onclick = () => {
      const name = b.dataset.catexpand;
      st.openCats.has(name) ? st.openCats.delete(name) : st.openCats.add(name);
      renderCatTree();
    });
    app.querySelectorAll('[data-suball]').forEach(b => b.onclick = () => {
      const name = b.dataset.suball, subs = SUBCATS[name] || [];
      const allOn = st.cats.has(name) && !subs.some(x => st.subs.has(`${name}::${x}`));
      if (allOn) st.cats.delete(name);                                  // toggle whole category off
      else { st.cats.add(name); subs.forEach(x => st.subs.delete(`${name}::${x}`)); }
      updateCatStrip(st.cats); renderCatTree(); syncVeh(); drawGrid();
    });
    app.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => {
      const key = b.dataset.sub, name = key.slice(0, key.indexOf('::'));
      if (st.subs.has(key)) {
        st.subs.delete(key);
        if (!(SUBCATS[name] || []).some(x => st.subs.has(`${name}::${x}`))) st.cats.delete(name); // last sub → off
      } else { st.cats.add(name); st.subs.add(key); }
      updateCatStrip(st.cats); renderCatTree(); syncVeh(); drawGrid();
    });
  };
  bindCatStrip(name => {
    toggleCat(st, name);
    updateCatStrip(st.cats); renderCatTree(); syncVeh(); drawGrid();
  });
  // B3: clear every filter back to the show-everything default.
  const resetFilters = () => {
    st.cats.clear(); st.subs.clear(); st.openCats.clear(); st.openSel.clear(); st.veh.clear(); st.q = ''; st.diff = ''; st.obj = '';
    app.querySelectorAll('#pf-q, #pfm-q').forEach(i => i.value = '');
    updateCatStrip(st.cats); renderCatTree(); renderSelFilters(); syncVeh(); drawGrid();
  };
  bind('pf-'); bind('pfm-');
  renderCatTree();
  renderSelFilters();
  syncVeh();
  bindFilterSheet('pfm-', st);
  bindFilterDrawer('pf-');
  app.querySelectorAll('[data-reset]').forEach(b => b.onclick = resetFilters);
  updateCatStrip(st.cats); // deep links (?category=…) arrive pre-selected
  drawView();
  drawGrid();
  icons();

  function bindPublicActions() {
  app.querySelectorAll('[data-vote]').forEach(btn => btn.onclick = async () => {
    if (!me) { sessionStorage.authNext = location.hash; location.hash = '#/login'; return; }
    const r = await fetch(`/api/scenarios/${btn.dataset.vote}/vote`, { method: 'POST' }).then(x => x.json());
    app.querySelector(`[data-votecount="${btn.dataset.vote}"]`).textContent = r.votes;
    btn.classList.toggle('bg-amber-600', r.voted); btn.classList.toggle('font-semibold', r.voted);
    btn.classList.toggle('bg-slate-700', !r.voted);
  });
  app.querySelectorAll('[data-clone]').forEach(btn => btn.onclick = async () => {
    if (!me) { sessionStorage.authNext = location.hash; location.hash = '#/login'; return; }
    btn.disabled = true;
    const r = await fetch(`/api/scenarios/${btn.dataset.clone}/clone`, { method: 'POST' });
    btn.disabled = false;
    if (!r.ok) return toast('Clone failed', 'bg-rose-600');
    // B5: stay put and offer an undo instead of yanking to My Library. Undo
    // deletes the copy we just made.
    const { id } = await r.json();
    cloneToast(async () => {
      const d = await fetch(`/api/scenarios/${id}`, { method: 'DELETE' });
      toast(d.ok ? 'Clone removed' : 'Could not undo the clone', d.ok ? undefined : 'bg-rose-600');
    });
  });
  app.querySelectorAll('[data-report]').forEach(btn => btn.onclick = async () => {
    if (!me) { sessionStorage.authNext = location.hash; location.hash = '#/login'; return; }
    const reason = prompt('Why are you reporting this scenario? (unsafe practice, wrong information, spam…)');
    if (!reason?.trim()) return;
    const r = await fetch(`/api/scenarios/${btn.dataset.report}/report`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ reason }),
    });
    if (r.ok) toast('Reported — thank you');
    else toast((await r.json()).error, 'bg-amber-500');
  });
  }
}

          : '<span class="text-[10px] font-bold tracking-wider bg-indigo-900/70 text-indigo-300 px-2 py-0.5 rounded-full">GLOBAL</span>'}</h1>

    </div>

      ${a.entries.map((e, i) => entryCard(e, i, a.mine)).join('') || '<p class="text-slate-500 italic">No scenarios in this academy yet.</p>'}

    <div class="bg-slate-800 rounded-2xl p-4 space-y-3">
      <p class="text-xs font-bold text-slate-500">CURATE</p>

    list.filter(s => !s.deleted_at && !inAcademy.has(s.id)).forEach(s => {

      sel.appendChild(o);

    save(true);
  };
  $('#ac-save').onclick = () => save();
  $('#ac-del').onclick = async () => {
    if (!(await confirmDialog({ title: `Delete "${a.name}"?`, body: 'Scenarios themselves are untouched.' }))) return;
    const r = await fetch(`/api/academies/${a.id}`, { method: 'DELETE' });
    if (r.ok) { toast('Academy deleted'); location.hash = '#/academies'; }
    else toast('Delete failed', 'bg-rose-600');

    const i = +b.dataset.up; if (!i) return;
    [entries[i - 1], entries[i]] = [entries[i], entries[i - 1]]; save(true);
  });
  app.querySelectorAll('[data-down]').forEach(b => b.onclick = () => {
    const i = +b.dataset.down; if (i >= entries.length - 1) return;
    [entries[i + 1], entries[i]] = [entries[i], entries[i + 1]]; save(true);
  });
  app.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => {
    const i = +b.dataset.pub; entries[i].published = !entries[i].published; save(true);
  });
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    entries.splice(+b.dataset.rm, 1); save(true);
  });
}

async function renderSolo(scenarioId) {
  const params = new URLSearchParams(location.hash.split('?')[1] || '');
  // Phase 3: `roles` is a comma-separated set; `role` is the legacy single value.
  const role = params.get('roles')
    ? params.get('roles').split(',').map(r => r.trim()).filter(Boolean)
    : (params.get('role') ? [params.get('role')] : []);
  const res = await fetch(`/api/scenarios/${scenarioId}`);
  if (!res.ok) { toast('Scenario not found', 'bg-rose-600'); location.hash = '#/public'; return; }
  const s = await res.json();
  fetch(`/api/scenarios/${scenarioId}/solo-start`, { method: 'POST' }).catch(() => {});
  // v7 stages: resolve blank stages (inherit previous) on the full list, then track-filter.
  let curStage = '';
  s.questions.forEach(q => { if (q.stage) curStage = q.stage; q.stage = curStage; });
  const stageNames = [...new Set(s.questions.map(q => q.stage).filter(Boolean))];
  const qs = s.questions.filter(q => !role.length || !hasRoles(q.roles) || rolesArr(q.roles).some(r => role.includes(r)));
  if (!qs.length) { toast('No questions for these roles', 'bg-amber-500'); location.hash = `#/scenario/${scenarioId}`; return; }
  // Solo advances stage-by-stage: later stages stay hidden until the player
  // finishes the current one (stageless scenarios show everything at once).
  const stageOf = q => Math.max(0, stageNames.indexOf(q.stage));
  const saved = {}; // question_id -> answer, synced live so tab switches keep work
  const byId = Object.fromEntries(qs.map(q => [q.id, q]));
  let soloStage = 0;
  // Part 7: stages are tabs under the sticky dispatch. A tab unlocks when the
  // previous stage is committed; 'all' shows every unlocked stage at once.
  let soloTab = stageNames.length ? 0 : 'all';
  const lastStage = stageNames.length ? stageNames.length - 1 : 0;
  const draw = () => {
  const showAll = soloTab === 'all';
  const visible = !stageNames.length ? qs
    : showAll ? qs.filter(q => stageOf(q) <= soloStage)
    : qs.filter(q => stageOf(q) === soloTab);
  // the submit/continue button acts on the current stage — only offer it where
  // those questions are on screen
  const canSubmit = !stageNames.length || showAll || soloTab === soloStage;
  app.innerHTML = `
  <main class="max-w-3xl mx-auto px-4 sm:px-6 pb-24 anim-in">
    <div class="sticky top-14 z-20 -mx-4 sm:-mx-6 px-4 sm:px-6 pt-4 pb-3 bg-slate-950/95 backdrop-blur border-b border-slate-800 space-y-2.5">
      <header class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <p class="text-xs font-bold text-rose-400 flex items-center gap-1.5"><i data-lucide="user" class="w-3.5 h-3.5"></i>SOLO RUN${role ? ` · <span class="text-amber-400">${esc(role)}</span>` : ''}</p>
          <h1 class="text-xl font-bold leading-tight">${esc(s.title)}</h1>
        </div>
        <button id="solo-exit" title="Exit run" class="tap shrink-0 flex items-center gap-1.5 text-xs font-semibold text-slate-400 hover:text-white px-2.5 py-1.5 rounded-lg hover:bg-slate-800"><i data-lucide="x" class="w-4 h-4"></i>Exit</button>
      </header>
      <div class="bg-rose-950/50 border border-rose-800/50 rounded-xl px-4 py-3 text-sm text-rose-100 max-h-36 overflow-y-auto">
        <p class="text-xs font-bold text-rose-300 mb-1">DISPATCH</p>
        <p class="whitespace-pre-wrap">${esc(s.description)}</p>
      </div>
      ${stageNames.length ? `
      <div id="solo-tabs" class="flex gap-1.5 overflow-x-auto">
        ${stageNames.map((n, i) => {
          const locked = i > soloStage, active = soloTab === i, done = i < soloStage;
          return `<button data-tab="${i}" ${locked ? 'disabled' : ''} class="tap shrink-0 flex items-center gap-1.5 text-xs font-bold px-3.5 py-2 rounded-full ${
            active ? 'bg-rose-600 text-white'
            : locked ? 'bg-slate-900 text-slate-600 cursor-not-allowed'
            : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
            <i data-lucide="${locked ? 'lock' : done ? 'check' : 'circle-dot'}" class="w-3.5 h-3.5 ${done && !active ? 'text-emerald-400' : ''}"></i>${esc(n)}</button>`;
        }).join('')}
        <button data-tab="all" class="tap shrink-0 text-xs font-bold px-3.5 py-2 rounded-full ${showAll ? 'bg-rose-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">All</button>
      </div>` : ''}
    </div>
    <div class="space-y-4 mt-4">
    ${!me ? `<div class="bg-amber-500/10 border border-amber-500/40 rounded-2xl px-4 py-3 text-xs text-amber-200">Playing as a guest — this run <b>won't be saved</b>.</div>` : ''}
    <div id="solo-cards" class="space-y-4">
    ${visible.map((q, i) => {
      const n = qs.indexOf(q) + 1; // stable numbering across tabs
      return (showAll && q.stage && q.stage !== visible[i - 1]?.stage
        ? `<div class="flex items-center gap-3 pt-2"><span class="text-xs font-black tracking-widest text-amber-400">${esc(q.stage.toUpperCase())}</span><span class="flex-1 h-px bg-slate-700"></span></div>` : '')
      + `
      <div class="bg-slate-800 rounded-2xl p-4 space-y-3">
        <p class="font-semibold text-sm leading-snug"><span class="text-rose-400 font-bold">Q${n}.</span> ${hasRoles(q.roles) ? `<span class="text-amber-400">${esc(roleLabel(q.roles))}</span> · ` : ''}${esc(q.prompt)}</p>
        ${(q.kind === 'multiple_choice' || q.kind === 'select_all')
          ? (() => {
              const selSet = q.kind === 'select_all' ? new Set((saved[q.id] || '').split('|').map(x => x.trim()).filter(Boolean)) : null;
              return `<div class="space-y-2">${q.kind === 'select_all' ? '<p class="text-xs text-slate-400">Select all that apply.</p>' : ''}${(q.choices || []).map(c => {
                const on = q.kind === 'select_all' ? selSet.has(c) : saved[q.id] === c;
                return `<label class="tap flex items-center gap-3 bg-slate-900 border ${on ? 'border-amber-500' : 'border-slate-700'} rounded-xl px-4 py-3 cursor-pointer has-[:checked]:border-amber-500">
                <input type="${q.kind === 'select_all' ? 'checkbox' : 'radio'}" name="solo-${q.id}" value="${esc(c)}" ${on ? 'checked' : ''} class="accent-rose-600 w-5 h-5"><span class="text-sm">${esc(c)}</span></label>`;
              }).join('')}</div>`;
            })()
          : `<textarea data-solo="${q.id}" rows="3" placeholder="Type your answer…" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:border-amber-500 focus:outline-none">${esc(saved[q.id] ?? '')}</textarea>`}
        <div class="flex items-center gap-2 text-xs text-slate-500"><i data-lucide="lock" class="w-3.5 h-3.5"></i>Official answer unlocks when you submit the full run</div>
      </div>`;
    }).join('')}
    </div>
    ${canSubmit
      ? `<button id="solo-submit" class="tap w-full bg-rose-600 hover:bg-rose-500 rounded-xl py-3.5 font-bold">${stageNames.length && soloStage < lastStage
          ? `Continue — next stage: “${esc(stageNames[soloStage + 1])}”` : 'Submit Run — Reveal Official Answers'}</button>`
      : `<p class="text-sm text-slate-500 italic text-center py-2">You can still edit this stage — switch to the <b>${esc(stageNames[soloStage])}</b> tab to continue.</p>`}
    </div>
  </main>`;
  icons();
  const answerOf = q => {
    if (q.kind === 'multiple_choice') return app.querySelector(`input[name="solo-${q.id}"]:checked`)?.value ?? '';
    if (q.kind === 'select_all') return [...app.querySelectorAll(`input[name="solo-${q.id}"]:checked`)].map(x => x.value).join(' | ');
    return app.querySelector(`[data-solo="${q.id}"]`)?.value.trim() ?? '';
  };
  const syncFromDom = q => { // only overwrite saved answers for on-screen questions
    if (app.querySelector(`[name="solo-${q.id}"],[data-solo="${q.id}"]`)) saved[q.id] = answerOf(q);
  };
  // live sync: answers survive tab switches and stage re-renders
  $('#solo-cards').addEventListener('input', e => {
    const qid = e.target.dataset.solo ?? (e.target.name?.startsWith('solo-') ? e.target.name.slice(5) : '');
    if (byId[qid]) saved[qid] = answerOf(byId[qid]);
  });
  app.querySelectorAll('#solo-tabs [data-tab]').forEach(b => b.onclick = () => {
    soloTab = b.dataset.tab === 'all' ? 'all' : Number(b.dataset.tab);
    draw();
  });
  $('#solo-exit').onclick = () => {
    visible.forEach(syncFromDom);
    const hasAnswers = Object.values(saved).some(v => v && v.trim());
    if (hasAnswers && !confirm('Exit this run? Your answers won\'t be saved.')) return;
    location.hash = `#/scenario/${s.id}`;
  };
  const submitBtn = $('#solo-submit');
  if (submitBtn) submitBtn.onclick = async () => {
    visible.forEach(syncFromDom);
    const current = stageNames.length ? qs.filter(q => stageOf(q) === soloStage) : qs;
    if (current.some(q => !saved[q.id])) return toast(stageNames.length ? 'Answer every question in this stage first' : 'Answer every question first — no partial reveals', 'bg-amber-500');
    if (stageNames.length && soloStage < lastStage) { soloStage++; soloTab = soloStage; draw(); window.scrollTo(0, 0); return; }
    const answers = Object.fromEntries(qs.map(q => [q.id, saved[q.id]]));
    const btn = $('#solo-submit'); btn.disabled = true; btn.textContent = 'Revealing…';
    // A2: everyone — guest or signed-in — lands on the same stateless After-Action
    // reveal. No silent auto-save-and-teleport; signed-in players save explicitly
    // from the reveal (deferred save), so they see their answers vs. official first.
    const r = await fetch(`/api/scenarios/${s.id}/solo-reveal`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers, roles: role }),
    });
    if (!r.ok) { toast('Submit failed', 'bg-rose-600'); btn.disabled = false; btn.textContent = 'Submit Run — Reveal Official Answers'; return; }
    const { official_answers } = await r.json();
    soloReveal(s, qs, answers, official_answers, role);
  };
  }; // draw
  draw();
}

// A2: on the After-Action reveal, the official answer is open by default — the
// comparison is the point of the debrief — but stays collapsible to re-hide.
const officialDrop = body => `
  <details open class="group bg-emerald-950/40 border border-emerald-900 rounded-xl text-sm text-emerald-100">
    <summary class="tap flex items-center gap-2 px-4 py-3 cursor-pointer text-xs font-bold text-emerald-400 select-none">
      <i data-lucide="chevron-right" class="w-4 h-4 transition-transform group-open:rotate-90"></i>OFFICIAL ANSWER</summary>
    <p class="px-4 pb-3 pt-1 whitespace-pre-wrap">${esc(body)}</p>
  </details>`;

// Deferred save of a completed solo run (A2). Takes primitives so it can be
// replayed after a guest signs in (see the auth handler). Returns the run id on
// success, or null. Order of qids is preserved so stage gating stays intact.
async function saveSoloRun(scenarioId, qids, answers, role) {
  const run = await fetch('/api/solo/runs', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ scenario_id: scenarioId, roles: role }),
  }).then(r => r.ok ? r.json() : null);
  if (!run) return null;
  let last = null;
  for (const qid of qids) {
    last = await fetch(`/api/solo/runs/${run.run_id}/answers`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question_id: qid, body: answers[qid] }),
    }).then(r => r.ok ? r.json() : null);
  }
  return last?.complete ? run.run_id : null;
}

// A2 — the unified After-Action reveal. Same landing for guest and signed-in:
// objectives frame → your answer vs. official (open) → explicit, deferred save →
// a simple Next in the same category. No auto-save; nothing here is stored until
// the player asks for it.
function soloReveal(s, qs, answers, official, role) {
  // Track C: prefer the scenario's full objective union (per-question rollup);
  // fall back to the headline primary/secondary for scenarios without it.
  const objectives = (s.objectives?.length ? s.objectives : [s.objective_primary, s.objective_secondary]).filter(Boolean);
  const saveBlock = me
    ? `<div id="reveal-actions" class="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2">
         <button id="rv-save" class="tap bg-emerald-600 hover:bg-emerald-500 rounded-xl py-3.5 font-bold flex items-center justify-center gap-2"><i data-lucide="save" class="w-5 h-5"></i>Save to Runs Completed</button>
         <button id="rv-discard" class="tap bg-slate-800 hover:bg-slate-700 rounded-xl py-3.5 px-6 font-semibold text-sm text-slate-300">Discard</button>
       </div>`
    : `<div id="reveal-actions" class="bg-amber-500/10 border border-amber-500/40 rounded-2xl px-4 py-4 space-y-3">
         <p class="text-sm text-amber-100 flex items-start gap-2"><i data-lucide="info" class="w-4 h-4 shrink-0 mt-0.5"></i><span>Keep this run — a free account saves it to your library, and every future solo run lands there too.</span></p>
         <button id="rv-signin" class="tap w-full bg-rose-600 hover:bg-rose-500 rounded-xl py-3.5 font-bold flex items-center justify-center gap-2"><i data-lucide="save" class="w-5 h-5"></i>Save — Sign in</button>
       </div>`;
  app.innerHTML = `
  <main class="max-w-3xl mx-auto p-4 sm:p-6 pb-28 space-y-4 anim-in">
    <header>
      <p class="text-xs font-bold text-emerald-400 flex items-center gap-1.5"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i>AFTER-ACTION${role ? ` · <span class="text-amber-400">${esc(role)}</span>` : ''}</p>
      <h1 class="text-xl font-bold leading-tight">${esc(s.title)}</h1>
    </header>
    ${objectives.length ? `
    <div class="bg-slate-800/60 border border-slate-700 rounded-2xl px-4 py-3">
      <p class="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1.5"><i data-lucide="target" class="w-3.5 h-3.5"></i>WHAT THIS SCENARIO TRAINS</p>
      <div class="flex flex-wrap gap-2">${objectives.map(o => `<span class="text-xs font-semibold bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 rounded-full px-3 py-1">${esc(o)}</span>`).join('')}</div>
    </div>` : ''}
    <div class="space-y-4">
    ${qs.map((q, i) => `
    <div class="bg-slate-800 rounded-2xl p-4 space-y-3">
      <p class="font-semibold text-sm leading-snug"><span class="text-rose-400 font-bold">Q${i + 1}.</span> ${hasRoles(q.roles) ? `<span class="text-amber-400">${esc(roleLabel(q.roles))}</span> · ` : ''}${esc(q.prompt)}</p>
      <div class="bg-slate-900 rounded-xl px-4 py-3 text-sm"><p class="text-xs font-bold text-slate-500 mb-1">YOUR ANSWER</p><p class="whitespace-pre-wrap">${esc(answers[q.id]) || '<span class="text-slate-500 italic">—</span>'}</p></div>
      ${officialDrop(official[q.id])}
    </div>`).join('')}
    </div>
    ${saveBlock}
    <div id="reveal-next"></div>
  </main>`;
  icons();

  const saveBtn = $('#rv-save');
  if (saveBtn) saveBtn.onclick = async () => {
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    const runId = await saveSoloRun(s.id, qs.map(q => q.id), answers, role);
    if (!runId) { toast('Could not save the run', 'bg-rose-600'); saveBtn.disabled = false; saveBtn.innerHTML = '<i data-lucide="save" class="w-5 h-5"></i>Save to Runs Completed'; icons(); return; }
    toast('Saved to Runs Completed');
    $('#reveal-actions').innerHTML =
      `<a href="#/session/${runId}" class="tap block text-center bg-slate-800 hover:bg-slate-700 rounded-xl py-3.5 font-semibold text-sm flex items-center justify-center gap-2"><i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>Saved — view in your library</a>`;
    icons();
  };
  const discardBtn = $('#rv-discard');
  if (discardBtn) discardBtn.onclick = () => { location.hash = `#/scenario/${s.id}`; };
  const signinBtn = $('#rv-signin');
  if (signinBtn) signinBtn.onclick = () => {
    // Stash the completed run so it saves automatically once the account exists.
    sessionStorage.pendingSoloRun = JSON.stringify({ scenario_id: s.id, role, answers, qids: qs.map(q => q.id) });
    sessionStorage.authNext = `#/scenario/${s.id}`;
    location.hash = '#/signup';
  };

  // Simple, non-personalized Next: another public scenario in the same category.
  if (s.category) fetch(`/api/public/scenarios?category=${encodeURIComponent(s.category)}`)
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      const next = (list || []).find(x => x.id !== s.id);
      if (!next) return;
      $('#reveal-next').innerHTML =
        `<a href="#/scenario/${next.id}" class="tap flex items-center justify-between gap-3 bg-slate-800 hover:bg-slate-700 rounded-2xl px-4 py-3.5">
           <span class="min-w-0"><span class="text-xs font-bold text-slate-400 block">NEXT IN ${esc(s.category.toUpperCase())}</span><span class="font-semibold text-sm truncate block">${esc(next.title)}</span></span>
           <i data-lucide="arrow-right" class="w-5 h-5 text-slate-400 shrink-0"></i></a>`;
      icons();
    }).catch(() => {});
}

        ${isHost && analysis ? responses.filter(r => r.question_id === qn.id).map(r => {
          const a = assessFor(r.id);
          return `<div class="bg-slate-900 rounded-xl px-4 py-3 text-sm space-y-1 ${a?.classification === 'review' ? 'border border-amber-500/40' : ''}">
            <div class="flex items-center justify-between gap-2"><p class="text-xs font-bold text-slate-500">${esc(r.display_tag)}${hasRoles(r.roles) ? ` · <span class="text-amber-400">${esc(roleLabel(r.roles))}</span>` : ''}${r.shift_label ? ` · <span class="text-sky-300">${esc(SHIFT_LABEL)} ${esc(r.shift_label)}</span>` : ''}</p>${a ? badge(a.classification) : ''}</div>
            <p>${esc(r.body)}</p>
            ${a ? `<p class="text-xs text-slate-400 italic">${esc(a.rationale)}</p>` : ''}
          </div>`;
        }).join('') : ''}
        ${pushed.map(p => `<div class="bg-slate-900 border-l-4 border-rose-500 rounded-lg px-3 py-2.5 text-sm"><p class="text-xs font-bold text-rose-400 mb-0.5">PUSHED · ${esc(p.display_tag)}${p.shift_label ? ` · ${esc(SHIFT_LABEL)} ${esc(p.shift_label)}` : ''}</p>${esc(p.body)}</div>`).join('')}
        ${qn.instructor_answer != null ? officialDrop(qn.instructor_answer) : ''}
        ${note ? `<div class="bg-amber-950/30 border border-amber-800/50 rounded-xl px-4 py-3 text-sm"><p class="text-xs font-bold text-amber-400 mb-1">YOUR NOTES</p>${esc(note.body)}</div>` : ''}
      </div>`;
    }).join('')}
  </main>`;
  icons();
  const gen = $('#aa-gen');
  if (gen) gen.onclick = async () => {
    gen.disabled = true; gen.textContent = 'Analyzing…';
    const r = await fetch(`/api/me/sessions/${session.id}/analysis`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (r.ok) { toast('After-action ready — review the drafts'); renderSessionDetail(id); }
    else { toast((await r.json()).error, 'bg-rose-600'); gen.disabled = false; gen.textContent = 'Generate'; }
  };
  const shareBtn = $('#aa-share');
  if (shareBtn) shareBtn.onclick = async () => {
    if (!confirm('Share all draft debriefs with their participants? They will see the current text.')) return;
    const r = await fetch(`/api/me/sessions/${session.id}/debriefs/share`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (r.ok) { toast('Debriefs shared with the crew'); renderSessionDetail(id); }
    else toast('Share failed', 'bg-rose-600');
  };
  app.querySelectorAll('[data-edit-debrief]').forEach(btn => btn.onclick = async () => {
    const card = btn.closest('[data-debrief]');
    const current = card.querySelector('[data-debrief-body]').textContent;
    const next = prompt('Edit this debrief (the participant will see exactly this):', current);
    if (next == null || !next.trim() || next === current) return;
    const r = await fetch(`/api/me/sessions/${session.id}/debriefs/${btn.dataset.editDebrief}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ body: next.trim() }) });
    if (r.ok) { toast('Debrief updated'); renderSessionDetail(id); }
    else toast('Update failed', 'bg-rose-600');
  });
}

function bindLaunchButtons() {
  app.querySelectorAll('[data-launch]').forEach(btn => btn.onclick = async () => {
    if (!me) { sessionStorage.authNext = location.hash; location.hash = '#/login'; return; }
    btn.disabled = true;
    const res = await fetch('/api/sessions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario_id: btn.dataset.launch }),
    });
    if (!res.ok) { toast('Could not launch session', 'bg-rose-600'); btn.disabled = false; return; }
    location.hash = '#/host/' + (await res.json()).room_code;
  });
}

/* ═══ Department ═══ */
async function renderDepartment() {
  if (!me) { sessionStorage.authNext = '#/department'; location.hash = '#/login'; return; }
  const data = await fetch('/api/departments/mine').then(r => r.json());

  if (!data.department) {
    app.innerHTML = `
    <main class="max-w-md mx-auto p-6 pt-10 space-y-5 anim-in">
      <h1 class="text-2xl font-bold">Department Space</h1>
      <div class="bg-slate-800 rounded-2xl p-5 space-y-3">
        <p class="font-semibold flex items-center gap-2"><i data-lucide="key-round" class="w-4 h-4 text-amber-400"></i>Join your department</p>
        <div class="flex gap-2">
          <input id="d-code" placeholder="8-character code" maxlength="8" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 uppercase font-mono tracking-widest focus:border-amber-500 focus:outline-none">
          <button id="d-join" class="tap bg-rose-600 hover:bg-rose-500 rounded-xl px-5 font-bold">Join</button>
        </div>
      </div>
      <div class="bg-slate-800 rounded-2xl p-5 space-y-3">
        <p class="font-semibold flex items-center gap-2"><i data-lucide="building-2" class="w-4 h-4 text-emerald-400"></i>Start a new department</p>
        <p class="text-sm text-slate-400">You become the Training Chief: you get the join code, the analytics dashboard, and the power to mark scenarios as Official Department Protocol.</p>
        <div class="flex gap-2">
          <input id="d-name" placeholder="e.g. Gettysburg Fire Department" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 focus:border-emerald-500 focus:outline-none">
          <button id="d-create" class="tap bg-emerald-600 hover:bg-emerald-500 rounded-xl px-5 font-bold">Create</button>
        </div>
      </div>
    </main>`;
    icons();
    $('#d-join').onclick = async () => {
      const btn = $('#d-join');
      btn.disabled = true;
      const r = await fetch('/api/departments/join', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: $('#d-code').value }) });
      if (r.ok) { const d = await r.json(); toast(`Welcome to ${d.name}`); await refreshMe(); renderDepartment(); }
      else { toast((await r.json()).error, 'bg-rose-600'); btn.disabled = false; }
    };
    $('#d-create').onclick = async () => {
      const btn = $('#d-create');
      btn.disabled = true;
      const r = await fetch('/api/departments', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: $('#d-name').value }) });
      if (r.ok) { toast('Submitted — your department is awaiting site approval'); await refreshMe(); renderDepartment(); }
      else { toast((await r.json()).error, 'bg-rose-600'); btn.disabled = false; }
    };
    return;
  }

  const { department, members, chief } = data;
  const analytics = chief ? await fetch('/api/departments/mine/analytics').then(r => r.json()) : null;
  app.innerHTML = `
  <main class="max-w-2xl mx-auto p-4 sm:p-6 space-y-5 anim-in">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="building-2" class="w-6 h-6 text-emerald-400"></i>${esc(department.name)}</h1>
        <p class="text-sm text-slate-400 mt-0.5">${chief ? 'You are the Training Chief' : 'Member'}${department.verified_at ? ' · verified department' : ''}</p>
      </div>
      <button id="d-leave" class="tap text-sm text-slate-400 hover:text-rose-400 px-3 py-2">Leave department</button>
    </div>

    ${!department.verified_at ? `
    <section class="bg-amber-950/40 border border-amber-800/50 rounded-2xl p-5 flex items-start gap-3">
      <i data-lucide="hourglass" class="w-5 h-5 text-amber-400 shrink-0 mt-0.5"></i>
      <div class="text-sm text-amber-100">
        <p class="font-bold text-amber-300">Awaiting site approval</p>
        <p class="mt-1">Your department is in the review queue. The join code activates and department scenarios unlock once it's approved.</p>
      </div>
    </section>` : ''}

    ${chief && department.verified_at ? `
    <section class="bg-slate-800 rounded-2xl p-5 flex items-center justify-between gap-4 flex-wrap">
      <div>
        <p class="text-sm text-slate-400">Join code — share it in the dayroom</p>
        <p class="text-3xl font-black tracking-[0.3em] text-amber-400 font-mono">${esc(department.join_code)}</p>
      </div>
      <button id="d-regen" class="tap flex items-center gap-1.5 text-sm bg-slate-700 hover:bg-slate-600 rounded-xl px-4 py-2.5"><i data-lucide="refresh-cw" class="w-4 h-4"></i>New code</button>
    </section>` : ''}

    <section class="bg-slate-800 rounded-2xl p-5 space-y-2">
      <h2 class="font-semibold flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 text-amber-400"></i>Members (${members.length})</h2>
      ${members.map(m => `
      <div class="flex items-center gap-3 py-1.5">
        <span class="flex-1">${esc(m.display_name)}</span>
        ${m.role === 'dept_admin' ? '<span class="text-xs font-semibold bg-emerald-900/60 text-emerald-300 px-2.5 py-1 rounded-full">Training Chief</span>' : ''}
        ${chief && m.id !== me.id ? `<button data-kick="${m.id}" class="tap text-slate-500 hover:text-rose-400 px-2 text-sm">Remove</button>` : ''}
      </div>`).join('')}
    </section>

    ${chief && analytics ? `
    <section class="bg-slate-800 rounded-2xl p-5 space-y-3">
      <h2 class="font-semibold flex items-center gap-2"><i data-lucide="chart-column" class="w-4 h-4 text-emerald-400"></i>Training Dashboard</h2>
      <div class="grid grid-cols-3 gap-3 text-center">
        <div class="bg-slate-900 rounded-xl p-3"><p class="text-2xl font-black text-emerald-400">${analytics.totals.sessions}</p><p class="text-xs text-slate-400">Sessions</p></div>
        <div class="bg-slate-900 rounded-xl p-3"><p class="text-2xl font-black text-amber-400">${analytics.totals.members_trained}</p><p class="text-xs text-slate-400">Members trained</p></div>
        <div class="bg-slate-900 rounded-xl p-3"><p class="text-2xl font-black text-rose-400">${analytics.totals.responses}</p><p class="text-xs text-slate-400">Responses</p></div>
      </div>
      ${analytics.sessions.length ? `
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead><tr class="text-left text-xs text-slate-500">
            <th class="py-2 pr-3">Scenario</th><th class="py-2 pr-3">Host</th><th class="py-2 pr-3">Date</th>
            <th class="py-2 pr-3 text-right">Crew</th><th class="py-2 text-right">Response rate</th>
          </tr></thead>
          <tbody>${analytics.sessions.map(s => `
            <tr class="border-t border-slate-700">
              <td class="py-2 pr-3">${esc(s.title)}</td>
              <td class="py-2 pr-3 text-slate-400">${esc(s.host_name)}</td>
              <td class="py-2 pr-3 text-slate-400">${esc(s.started_at.slice(0, 10))}</td>
              <td class="py-2 pr-3 text-right">${s.participant_count}</td>
              <td class="py-2 text-right font-semibold ${s.response_rate >= 70 ? 'text-emerald-400' : s.response_rate >= 40 ? 'text-amber-400' : 'text-rose-400'}">${s.response_rate}%</td>
            </tr>`).join('')}</tbody>
        </table>
      </div>` : '<p class="text-sm text-slate-500 italic">No sessions hosted by department members yet.</p>'}
    </section>

    <section class="bg-slate-800 rounded-2xl p-5 space-y-2">
      <h2 class="font-semibold flex items-center gap-2"><i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i>Official Department Protocol</h2>
      <p class="text-sm text-slate-400">Department-visibility scenarios you can badge. Official scenarios pin to the top of every member's library.</p>
      <div id="d-official" class="space-y-2"></div>
    </section>` : ''}
  </main>`;
  icons();
  $('#d-leave').onclick = async () => {
    if (!confirm('Leave this department?')) return;
    const r = await fetch('/api/departments/leave', { method: 'POST' });
    if (r.ok) { toast('Left department'); await refreshMe(); renderDepartment(); }
    else toast((await r.json()).error, 'bg-rose-600');
  };
  if (chief) {
    const regen = $('#d-regen');
    if (regen) regen.onclick = async () => {
      await fetch('/api/departments/regenerate-code', { method: 'POST' });
      toast('Join code regenerated'); renderDepartment();
    };
    app.querySelectorAll('[data-kick]').forEach(btn => btn.onclick = async () => {
      if (!confirm('Remove this member from the department?')) return;
      await fetch('/api/departments/remove-member', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user_id: btn.dataset.kick }) });
      renderDepartment();
    });
    // list department scenarios with official toggles
    const all = await fetch('/api/scenarios').then(r => r.json());
    const deptScenarios = all.filter(s => s.shared_department && !s.deleted_at);
    $('#d-official').innerHTML = deptScenarios.map(s => `
      <div class="flex items-center gap-3 bg-slate-900 rounded-xl p-3">
        <span class="flex-1 text-sm font-medium truncate">${esc(s.title)}</span>
        <button data-official="${s.id}" data-state="${s.is_official}" class="tap text-xs font-bold px-3 py-2 rounded-lg ${s.is_official ? 'bg-emerald-600' : 'bg-slate-700 hover:bg-slate-600'}">
          ${s.is_official ? '✓ OFFICIAL' : 'Mark Official'}</button>
      </div>`).join('') || '<p class="text-sm text-slate-500 italic">No department-visibility scenarios yet — set a scenario\'s visibility to Department in the creator.</p>';
    $('#d-official').querySelectorAll('[data-official]').forEach(btn => btn.onclick = async () => {
      const r = await fetch(`/api/scenarios/${btn.dataset.official}/official`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ official: btn.dataset.state !== '1' }),
      });
      if (r.ok) renderDepartment(); else toast((await r.json()).error, 'bg-rose-600');
    });
  }
}

/* ═══ Moderation (site admin) ═══ */
/* ═══ Review queue (PRD-v8) ═══ */
async function renderReview() {
  if (!me) { sessionStorage.authNext = '#/review'; location.hash = '#/login'; return; }
  const res = await fetch('/api/review/queue');
  if (!res.ok) { toast('Reviewers only', 'bg-rose-600'); location.hash = '#/'; return; }
  const queue = await res.json();
  app.innerHTML = `
  <main class="max-w-2xl mx-auto p-4 sm:p-6 space-y-5 anim-in">
    <div class="flex items-center gap-3">
      <i data-lucide="clipboard-check" class="w-7 h-7 text-sky-400"></i>
      <div>
        <h1 class="text-2xl font-bold">Review Queue</h1>
        <p class="text-sm text-slate-400">${me.role === 'site_admin' ? 'All scenarios submitted for official review' : `Scenarios submitted by ${esc(me.department?.name ?? 'your department')} members`}</p>
      </div>
    </div>
    ${queue.map(s => `
    <div class="bg-slate-800 rounded-2xl p-4 space-y-3">
      <div class="flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <p class="font-bold">${esc(s.title)}</p>
          <p class="text-sm text-slate-400">${esc(s.category)} · ${esc(s.subcategory)}${s.difficulty ? ' · ' + esc(s.difficulty) : ''}${s.objective_primary ? ' · ' + esc(s.objective_primary) : ''}</p>
        </div>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-700 text-slate-300 shrink-0">${esc(s.visibility)}</span>
      </div>
      ${s.description ? `<p class="text-sm text-slate-300 leading-relaxed line-clamp-3">${esc(s.description)}</p>`
        : `<p class="text-sm text-amber-400/80 italic">No dispatch description — add one in Review &amp; Edit.</p>`}
      <div class="flex items-center justify-between gap-3 pt-1">
        <p class="text-xs text-slate-500 min-w-0 truncate">by ${esc(s.author_name ?? 'unknown')} · ${s.question_count} questions · ${new Date(s.submitted_at + 'Z').toLocaleDateString()}</p>
        <a href="#/create/${s.id}" class="tap inline-flex items-center bg-sky-600 hover:bg-sky-500 rounded-xl px-4 py-2.5 font-semibold text-sm shrink-0 self-center whitespace-nowrap">Review &amp; Edit</a>
      </div>
    </div>`).join('') || `
    <div class="bg-slate-800 rounded-2xl p-8 text-center space-y-2">
      <i data-lucide="check-circle-2" class="w-8 h-8 text-emerald-400 mx-auto"></i>
      <p class="font-semibold">Queue is clear</p>
      <p class="text-sm text-slate-400">When an instructor submits a scenario for official review, it lands here.</p>
    </div>`}
  </main>`;
  icons();
}

async function renderModeration() {
  if (!me || me.role !== 'site_admin') { location.hash = '#/'; return; }
  const [reports, pendingDepts] = await Promise.all([
    fetch('/api/moderation/reports').then(r => r.json()),
    fetch('/api/moderation/departments').then(r => r.json()),
  ]);
  app.innerHTML = `
  <main class="max-w-2xl mx-auto p-4 sm:p-6 space-y-4 anim-in">
    <h1 class="text-2xl font-bold flex items-center gap-2"><i data-lucide="shield-alert" class="w-6 h-6 text-rose-400"></i>Moderation Queue</h1>

    <h2 class="font-semibold flex items-center gap-2 pt-1"><i data-lucide="graduation-cap" class="w-4 h-4 text-indigo-400"></i>Learning Objectives</h2>
    <div class="bg-slate-800 rounded-2xl p-4 space-y-2">
      <p class="text-sm text-slate-400">The controlled vocabulary authors tag scenarios with. Additions are permanent — keep it curated.</p>
      <div class="flex gap-2">
        <input id="obj-name" placeholder="New objective, e.g. Salvage & Overhaul" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-indigo-500 focus:outline-none">
        <button id="obj-add" class="tap text-sm bg-indigo-600 hover:bg-indigo-500 rounded-xl px-4 py-2.5 font-semibold">Add</button>
      </div>
    </div>

    <h2 class="font-semibold flex items-center gap-2 pt-1"><i data-lucide="building-2" class="w-4 h-4 text-amber-400"></i>Pending Departments</h2>
    ${pendingDepts.map(d => `
    <div class="bg-slate-800 rounded-2xl p-4 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <p class="font-bold truncate">${esc(d.name)}</p>
        <span class="text-xs text-slate-500 shrink-0">${d.member_count} member${d.member_count === 1 ? '' : 's'}</span>
      </div>
      <p class="text-sm text-slate-400">requested by ${esc(d.creator_name ?? 'unknown')} (${esc(d.creator_email ?? '—')}) · ${esc(d.created_at)}</p>
      <div class="flex gap-2">
        <button data-dept="${d.id}" data-daction="reject" class="tap flex-1 text-sm bg-slate-700 hover:bg-slate-600 rounded-xl py-2.5 font-semibold">Reject</button>
        <button data-dept="${d.id}" data-daction="approve" class="tap flex-1 text-sm bg-emerald-600 hover:bg-emerald-500 rounded-xl py-2.5 font-bold">Approve</button>
      </div>
    </div>`).join('') || '<p class="text-sm text-slate-500 italic">No departments awaiting approval.</p>'}

    <h2 class="font-semibold flex items-center gap-2 pt-2"><i data-lucide="flag" class="w-4 h-4 text-rose-400"></i>Reported Scenarios</h2>
    ${reports.map(r => `
    <div class="bg-slate-800 rounded-2xl p-4 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <p class="font-bold truncate">${esc(r.title)}</p>
        <span class="text-xs text-slate-500 shrink-0">${r.open_reports} open report${r.open_reports > 1 ? 's' : ''}</span>
      </div>
      <p class="text-sm text-slate-400">by ${esc(r.author_name ?? 'unknown')} · reported ${esc(r.created_at)}</p>
      <p class="text-sm bg-slate-900 rounded-xl px-3 py-2">"${esc(r.reason)}"</p>
      <div class="flex gap-2">
        <button data-resolve="${r.id}" data-action="dismiss" class="tap flex-1 text-sm bg-slate-700 hover:bg-slate-600 rounded-xl py-2.5 font-semibold">Dismiss</button>
        <button data-resolve="${r.id}" data-action="unlist" class="tap flex-1 text-sm bg-rose-700 hover:bg-rose-600 rounded-xl py-2.5 font-bold">Unlist Scenario</button>
      </div>
    </div>`).join('') || '<p class="text-slate-500 italic">Queue is empty. All quiet.</p>'}
  </main>`;
  icons();
  $('#obj-add').onclick = async () => {
    const name = $('#obj-name').value.trim();
    if (!name) return toast('Type an objective name first', 'bg-amber-500');
    const r = await fetch('/api/objectives', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }),
    });
    if (r.ok) { toast(`"${name}" added to the vocabulary`); $('#obj-name').value = ''; }
    else toast('Could not add objective', 'bg-rose-600');
  };
  app.querySelectorAll('[data-resolve]').forEach(btn => btn.onclick = async () => {
    await fetch(`/api/moderation/reports/${btn.dataset.resolve}/resolve`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: btn.dataset.action }),
    });
    toast(btn.dataset.action === 'unlist' ? 'Scenario unlisted' : 'Report dismissed');
    renderModeration();
  });
  app.querySelectorAll('[data-dept]').forEach(btn => btn.onclick = async () => {
    if (btn.dataset.daction === 'reject' &&
        !confirm('Reject this department? It will be deleted and its creator reset to a standard member.')) return;
    const r = await fetch(`/api/moderation/departments/${btn.dataset.dept}/${btn.dataset.daction}`, { method: 'POST' });
    if (r.ok) toast(btn.dataset.daction === 'approve' ? 'Department approved' : 'Department rejected');
    else toast((await r.json()).error, 'bg-rose-600');
    renderModeration();
  });
}

async function refreshMe() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  renderNav();
}

async function boot() {
  me = await fetch('/api/me').then(r => r.json()).catch(() => null);
  renderNav();
  route();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
}
boot();
</script>
